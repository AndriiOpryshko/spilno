name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: |
            services/core/go.sum
            services/core/tools/go.sum
      - name: Generated code is up to date
        run: ./scripts/gen.sh && git diff --exit-code -- .
      - name: Lint (includes bounded-context rules)
        run: go tool -modfile=tools/go.mod golangci-lint run ./...
      - name: Test (unit + integration on testcontainers)
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    # Browsers and their system packages come preinstalled; keep the tag equal to
    # apps/web's playwright version (checked below) instead of apt-installing them.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      # The container runs as root while the workspace belongs to the runner user, so git
      # treats the checkout as "dubious ownership" and the diff check below sees no repo.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: pnpm --filter @spilno/web gen:api && git diff --exit-code -- apps/web/src/api/gen
      - run: pnpm --filter @spilno/web lint
      - run: pnpm --filter @spilno/web typecheck
      - run: pnpm --filter @spilno/web test
      - name: Playwright image matches the pinned version
        run: test "$(pnpm --filter @spilno/web exec playwright --version)" = "Version 1.64.1"
      - name: Story tests (render, interactions, a11y in Chromium)
        run: pnpm --filter @spilno/web test:stories
      - run: pnpm --filter @spilno/web build
        env:
          VITE_OPERATOR_CONTACT_EMAIL: operator@example.test

  e2e:
    runs-on: ubuntu-latest
    needs: [core, web]
    # Browsers and their system packages come preinstalled; keep the tag equal to
    # apps/web's playwright version (checked below) instead of apt-installing them.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: spilno
          POSTGRES_PASSWORD: spilno
          POSTGRES_DB: spilno
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spilno -d spilno"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      # Same as in web: go build stamps VCS info and needs git to trust the workspace.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright image matches the pinned version
        run: test "$(pnpm --filter @spilno/web exec playwright --version)" = "Version 1.64.1"
      - name: Create the app login role
        run: |
          apt-get update -qq && apt-get install -y -qq postgresql-client
          psql postgres://spilno:spilno@postgres:5432/spilno -v ON_ERROR_STOP=1 -f infra/postgres-init/01-app-role.sql
          # The e2e seed (apps/web/e2e/seed) writes only into a database that says it is the e2e one.
          psql postgres://spilno:spilno@postgres:5432/spilno -v ON_ERROR_STOP=1 -c "ALTER DATABASE spilno SET spilno.e2e = 'on'"
      - name: Start core API
        working-directory: services/core
        env:
          # Inside a job container the service is reached by its name, not localhost.
          MIGRATIONS_DATABASE_URL: postgres://spilno:spilno@postgres:5432/spilno?sslmode=disable
          DATABASE_URL: postgres://spilno_app_login:spilno_app_login@postgres:5432/spilno?sslmode=disable
          # The sign-in provider is faked: the dev shim takes the callback code as a verified address.
          SPILNO_DEV_SIGN_IN: "true"
          SPILNO_DEV_STORAGE: "true"
          SPILNO_OPERATOR_EMAIL: operator@example.test
          # Placeholder Google client and token key (32 bytes, base64): the storage line renders, nothing calls Google.
          GOOGLE_OAUTH_CLIENT_ID: e2e-client.invalid
          GOOGLE_OAUTH_CLIENT_SECRET: e2e-secret
          GOOGLE_TOKEN_KEY_ID: e2e
          GOOGLE_TOKEN_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          go build -o /tmp/api ./cmd/api
          /tmp/api > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            node -e "fetch('http://localhost:8080/system/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0
            sleep 1
          done
          cat /tmp/api.log; exit 1
      - run: pnpm --filter @spilno/web e2e
        env:
          # The owner connection the signed-protocol seed is written over.
          E2E_OWNER_DATABASE_URL: postgres://spilno:spilno@postgres:5432/spilno?sslmode=disable
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  # Load smoke of PRD section 6: the read, write and filing scenarios of tests/load against the
  # real API on a real Postgres, with the PRD numbers as thresholds (p95 200 ms read, 500 ms write,
  # 5 s for a 5 MB filing, 50 req/s on the read path, no failed request). The run is short (30 s of
  # reads and of writes, 5 filings) because a shared runner is a 2-4 vCPU VM that also hosts
  # Postgres and the API. What it proves: the throughput and the error rate (the open-loop client
  # either keeps 50 req/s or does not), and that no query regressed by an order of magnitude.
  # What it cannot prove: absolute latency or headroom on production hardware; a neighbour on the
  # runner can add tens of milliseconds to a p95, so a single red p95 with throughput and errors
  # green is a reason to rerun and then to look, not proof of a regression. If the p95 turns out
  # to be too noisy, pass a looser LOAD_READ_P95 here and keep the throughput and error checks.
  load:
    runs-on: ubuntu-latest
    needs: [core]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: spilno
          POSTGRES_PASSWORD: spilno
          POSTGRES_DB: spilno
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spilno -d spilno"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          # Go from mise.toml serves both the API build and `mise run load`; node, pnpm and
          # mprocs are not used by this job.
          install_args: go
      - name: Create the app login role
        run: psql postgres://spilno:spilno@localhost:5432/spilno -v ON_ERROR_STOP=1 -f infra/postgres-init/01-app-role.sql
      - name: Start core API
        working-directory: services/core
        env:
          MIGRATIONS_DATABASE_URL: postgres://spilno:spilno@localhost:5432/spilno?sslmode=disable
          DATABASE_URL: postgres://spilno_app_login:spilno_app_login@localhost:5432/spilno?sslmode=disable
          # Same faked sign-in and storage as the e2e job; the load client signs in through the shim.
          SPILNO_DEV_SIGN_IN: "true"
          SPILNO_DEV_STORAGE: "true"
          SPILNO_OPERATOR_EMAIL: operator@example.test
          GOOGLE_OAUTH_CLIENT_ID: e2e-client.invalid
          GOOGLE_OAUTH_CLIENT_SECRET: e2e-secret
          GOOGLE_TOKEN_KEY_ID: e2e
          GOOGLE_TOKEN_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          go build -o /tmp/api ./cmd/api
          /tmp/api > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://localhost:8080/system/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/api.log; exit 1
      - name: Load smoke (PRD section 6 thresholds)
        env:
          LOAD_BASE_URL: http://localhost:8080
          LOAD_OPERATOR_EMAIL: operator@example.test
          LOAD_DURATION: 30s
          LOAD_FILINGS: "5"
        run: mise run load
      - if: failure()
        run: tail -n 100 /tmp/api.log
