# git-cliff: the deterministic changelog that .github/workflows/release.yml builds on merge.
# Conventional Commits map onto the six Keep a Changelog categories; what a reader never
# feels (test, ci, chore, docs, build, style, merges) is dropped. No LLM involved.
# Try it locally: mise exec git-cliff -- git cliff v0.1.0..v0.2.0 --tag v0.2.0

[changelog]
header = ""
# The leading <!-- n --> fixes the category order; striptags removes it from the output.
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.breaking %} (**breaking**){% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^(feat|fix|refactor)(\\([^)]*\\))?!?: .*(?i:deprecat)", group = "<!-- 2 -->Deprecated" },
  { message = "^(feat|fix)(\\([^)]*\\))?!?: .*(?i:security|vulnerab|cve-)", group = "<!-- 5 -->Security" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
  { message = ".*", skip = true },
]
