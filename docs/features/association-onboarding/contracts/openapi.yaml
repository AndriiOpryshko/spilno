  schemas:
    # copies of repo components (same shape)
    Problem:
      description: |
        RFC 9457 problem details (internal/platform/httpapi). `code` is an extension member
        `<context>.<error_name>`; it is set by a context and absent on a 422 from the shared request validator.
        Delta to the repo schema: adds `code`.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          pattern: "^[a-z]+\\.[a-z_]+$"
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string }
        detail: { type: string }

    # changed repo component (merge note)
    Principal:
      description: Changed — the signed-in person only; associations from listMemberships (ADR-0004). `is_operator` = the session address equals the configured оператор (ADR-0001).
      type: object
      additionalProperties: false
      required: [account_id, email, is_operator]
      properties:
        account_id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 320 }
        is_operator: { type: boolean }

    # enums (closed sets of data-model.md; Go constants, no CHECK)
    ApplicationKind:
      description: applications.kind — заявка на підключення / запит на передачу.
      type: string
      enum: [connection, transfer]
    ApplicationState:
      description: applications.state (PRD §10) — очікує · схвалена · відхилена.
      type: string
      enum: [pending, approved, rejected]
    DecisionOutcome:
      type: string
      enum: [approved, rejected]
    BoardPosition:
      description: application_filings.position and board_member_revisions.position — голова правління / член правління.
      type: string
      enum: [head, member]
    AssociationState:
      description: associations.state — підключене ОСББ / вимкнене ОСББ.
      type: string
      enum: [connected, disabled]
    ReviewWarningKind:
      description: розбіжність імен (AC-11) or an extract older than 30 days (AC-11b); advisory only.
      type: string
      enum: [name_mismatch, extract_age]
    AssociationEventKind:
      type: string
      enum: [connected, transfer_approved, disabled, enabled]

    # memberships
    Membership:
      type: object
      additionalProperties: false
      required: [association_id, association_name, association_state, board_member_id, position]
      properties:
        association_id: { type: string, format: uuid }
        association_name: { type: string, maxLength: 200 }
        association_state: { $ref: "#/components/schemas/AssociationState" }
        board_member_id: { type: string, format: uuid }
        position: { $ref: "#/components/schemas/BoardPosition" }
    MembershipPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
        next_cursor: { type: [string, "null"] }

    # applications
    NewApplication:
      description: multipart body of fileApplication; application + its first filing + the extract.
      type: object
      required: [kind, edrpou, association_name, association_address, applicant_full_name, position, term_start, extract]
      properties:
        kind: { $ref: "#/components/schemas/ApplicationKind" }
        edrpou: { type: string, pattern: "^[0-9]{8}$", minLength: 8, maxLength: 8 }
        association_id:
          description: Only for a запит filed from the card of the association set up by hand (AC-19c).
          type: string
          format: uuid
        association_name: { type: string, minLength: 1, maxLength: 200 }
        association_address: { type: string, minLength: 1, maxLength: 500 }
        applicant_full_name: { type: string, minLength: 1, maxLength: 200 }
        position: { $ref: "#/components/schemas/BoardPosition" }
        term_start: { type: string, format: date }
        term_end: { type: string, format: date }
        extract:
          description: The КЕП-signed витяг з ЄДР as uploaded, ≤ 5 MB (PRD §6); kept unchanged, never parsed (ADR-0005).
          type: string
          contentMediaType: application/octet-stream
    ApplicationRefiling:
      description: multipart body of refileApplication; a new filing of the same application (AC-06).
      type: object
      required: [association_name, association_address, applicant_full_name, position, term_start, extract]
      properties:
        association_name: { type: string, minLength: 1, maxLength: 200 }
        association_address: { type: string, minLength: 1, maxLength: 500 }
        applicant_full_name: { type: string, minLength: 1, maxLength: 200 }
        position: { $ref: "#/components/schemas/BoardPosition" }
        term_start: { type: string, format: date }
        term_end: { type: string, format: date }
        extract:
          description: The new КЕП-signed витяг з ЄДР, ≤ 5 MB.
          type: string
          contentMediaType: application/octet-stream
    Application:
      description: applications row + its latest filing's name and date + the latest rejection reason.
      type: object
      additionalProperties: false
      required: [id, kind, edrpou, association_id, association_name, state, filed_at, rejection_reason, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ApplicationKind" }
        edrpou: { type: string, maxLength: 8 }
        association_id: { type: [string, "null"], format: uuid }
        association_name: { type: string, maxLength: 200 }
        state: { $ref: "#/components/schemas/ApplicationState" }
        filed_at:
          description: created_at of the latest filing (AC-05 «очікує розгляду з …»).
          type: string
          format: date-time
        rejection_reason: { type: [string, "null"], maxLength: 1000 }
        created_at: { type: string, format: date-time }
    ApplicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        next_cursor: { type: [string, "null"] }
    ExtractRef:
      description: application_extracts metadata; the content is served only by the download operations.
      type: object
      additionalProperties: false
      required: [id, original_name, media_type, size_bytes, sha256]
      properties:
        id: { type: string, format: uuid }
        original_name: { type: string, maxLength: 255 }
        media_type: { type: string, maxLength: 100 }
        size_bytes: { type: integer, format: int64, maximum: 5242880 }
        sha256:
          description: Hex of the 32-byte SHA-256 of the stored content.
          type: string
          pattern: "^[0-9a-f]{64}$"
    ApplicationFiling:
      type: object
      additionalProperties: false
      required: [id, association_name, association_address, applicant_full_name, position, term_start, term_end, extract, created_at]
      properties:
        id: { type: string, format: uuid }
        association_name: { type: string, maxLength: 200 }
        association_address: { type: string, maxLength: 500 }
        applicant_full_name: { type: string, maxLength: 200 }
        position: { $ref: "#/components/schemas/BoardPosition" }
        term_start: { type: string, format: date }
        term_end: { type: [string, "null"], format: date }
        extract: { $ref: "#/components/schemas/ExtractRef" }
        created_at: { type: string, format: date-time }
    ApplicationDecision:
      type: object
      additionalProperties: false
      required: [id, filing_id, outcome, reason, relied_on_document, association_id, decided_at]
      properties:
        id: { type: string, format: uuid }
        filing_id: { type: string, format: uuid }
        outcome: { $ref: "#/components/schemas/DecisionOutcome" }
        reason: { type: [string, "null"], maxLength: 1000 }
        relied_on_document: { type: [string, "null"], maxLength: 500 }
        association_id: { type: [string, "null"], format: uuid }
        decided_at: { type: string, format: date-time }
    ApplicationDetail:
      description: The applicant's view; filings and decisions newest first.
      type: object
      additionalProperties: false
      required: [application, filings, decisions]
      properties:
        application: { $ref: "#/components/schemas/Application" }
        filings:
          type: array
          items: { $ref: "#/components/schemas/ApplicationFiling" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/ApplicationDecision" }
    NewExtractCheck:
      type: object
      additionalProperties: false
      required: [filing_id, signature_valid, signer_full_name, signed_on, head_full_name, extract_edrpou, extract_dated_on]
      properties:
        filing_id: { type: string, format: uuid }
        signature_valid: { type: boolean }
        signer_full_name: { type: string, minLength: 1, maxLength: 200 }
        signed_on: { type: string, format: date }
        head_full_name: { type: string, minLength: 1, maxLength: 200 }
        extract_edrpou: { type: string, pattern: "^[0-9]{8}$", minLength: 8, maxLength: 8 }
        extract_dated_on: { type: string, format: date }
    ExtractCheck:
      type: object
      additionalProperties: false
      required: [id, filing_id, signature_valid, signer_full_name, signed_on, head_full_name, extract_edrpou, extract_dated_on, checked_at]
      properties:
        id: { type: string, format: uuid }
        filing_id: { type: string, format: uuid }
        signature_valid: { type: boolean }
        signer_full_name: { type: string, maxLength: 200 }
        signed_on: { type: string, format: date }
        head_full_name: { type: string, maxLength: 200 }
        extract_edrpou: { type: string, maxLength: 8 }
        extract_dated_on: { type: string, format: date }
        checked_at: { type: string, format: date-time }
    ReviewWarning:
      type: object
      additionalProperties: false
      required: [kind, detail]
      properties:
        kind: { $ref: "#/components/schemas/ReviewWarningKind" }
        detail:
          description: Which values differ, or the extract's date (AC-11, AC-11b).
          type: string
          maxLength: 500
    ApplicationReview:
      description: The оператор's view (AC-10). Values entered by the applicant and recorded by the оператор are told apart by where they sit (filings vs checks).
      type: object
      additionalProperties: false
      required: [application, applicant_email, filings, checks, decisions, warnings, competing_application_ids, storage_account_email]
      properties:
        application: { $ref: "#/components/schemas/Application" }
        applicant_email: { type: string, format: email, maxLength: 320 }
        filings:
          type: array
          items: { $ref: "#/components/schemas/ApplicationFiling" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ExtractCheck" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/ApplicationDecision" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ReviewWarning" }
        competing_application_ids:
          description: Other pending applications for the same ЄДРПОУ (AC-04c, AC-19b).
          type: array
          items: { type: string, format: uuid }
        storage_account_email:
          description: For a запит на передачу — the account that holds the association's files (AC-28b); null otherwise.
          type: [string, "null"]
          format: email
          maxLength: 320
    ApproveApplicationRequest:
      type: object
      additionalProperties: false
      required: [filing_id]
      properties:
        filing_id:
          description: The filing shown to the оператор; a newer filing answers identity.application_not_pending.
          type: string
          format: uuid
        relied_on_document:
          description: Required when розбіжність імен is open (AC-12).
          type: string
          minLength: 1
          maxLength: 500
    RejectApplicationRequest:
      type: object
      additionalProperties: false
      required: [filing_id, reason]
      properties:
        filing_id: { type: string, format: uuid }
        reason:
          description: Shown to the applicant; empty → identity.reason_required (AC-13).
          type: string
          maxLength: 1000

    # associations
    OperatorAssociation:
      type: object
      additionalProperties: false
      required: [id, name, edrpou, state, connected_by_hand, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        edrpou: { type: [string, "null"], maxLength: 8 }
        state: { $ref: "#/components/schemas/AssociationState" }
        connected_by_hand:
          description: confirmed_by_decision_id is null — «підключено вручну, без витягу».
          type: boolean
        created_at: { type: string, format: date-time }
    OperatorAssociationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OperatorAssociation" }
        next_cursor: { type: [string, "null"] }
    DisableAssociationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          description: Shown to the members; empty → identity.reason_required (AC-22).
          type: string
          maxLength: 1000
    AssociationStateChange:
      description: association_state_changes row.
      type: object
      additionalProperties: false
      required: [association_id, state, reason, changed_at]
      properties:
        association_id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/AssociationState" }
        reason: { type: [string, "null"], maxLength: 1000 }
        changed_at: { type: string, format: date-time }
    AssociationEvent:
      description: |
        One step of the chain on the card — an approval (with the extract it relied on) or a state change.
        A roster entry's `decision_id` (`BoardMember`, governance) matches `decision_id` here, which gives the
        «за запитом на передачу від <filed_at>, схвалено оператором <occurred_at>» mark and the extract of AC-20.
      type: object
      additionalProperties: false
      required: [kind, occurred_at, decision_id, filed_at, reason, head_full_name, signer_full_name, extract_id, extract_dated_on]
      properties:
        kind: { $ref: "#/components/schemas/AssociationEventKind" }
        occurred_at: { type: string, format: date-time }
        decision_id:
          description: application_decisions.id of an approval; null for a state change.
          type: [string, "null"]
          format: uuid
        filed_at:
          description: created_at of the filing the approval decided; null for a state change.
          type: [string, "null"]
          format: date-time
        reason: { type: [string, "null"], maxLength: 1000 }
        head_full_name: { type: [string, "null"], maxLength: 200 }
        signer_full_name: { type: [string, "null"], maxLength: 200 }
        extract_id: { type: [string, "null"], format: uuid }
        extract_dated_on: { type: [string, "null"], format: date }
    AssociationCard:
      type: object
      additionalProperties: false
      required: [id, name, edrpou, address, state, head_full_name, connected_by_hand, history]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        edrpou: { type: [string, "null"], maxLength: 8 }
        address: { type: [string, "null"], maxLength: 500 }
        state: { $ref: "#/components/schemas/AssociationState" }
        head_full_name:
          description: The roster entry with position head, if any (null for the association set up by hand until AC-19c).
          type: [string, "null"]
          maxLength: 200
        connected_by_hand: { type: boolean }
        history:
          description: Newest first (AC-29).
          type: array
          items: { $ref: "#/components/schemas/AssociationEvent" }

    # storage connection
    StorageConnection:
      type: object
      additionalProperties: false
      required: [connected, google_account_email, connected_by_member_id, connected_at]
      properties:
        connected: { type: boolean }
        google_account_email: { type: [string, "null"], format: email, maxLength: 320 }
        connected_by_member_id: { type: [string, "null"], format: uuid }
        connected_at: { type: [string, "null"], format: date-time }
    CompleteStorageConnectionRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
