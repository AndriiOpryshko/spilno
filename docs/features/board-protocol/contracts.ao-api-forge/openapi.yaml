      summary: Save the wording of one agenda item by hand
      description: |
        Appends a wording version with its author; every slot keeps its value and source (AC-11).
        A stale protocol_revision answers governance.draft_changed with the newer revision in
        detail (AC-11b). In ready_for_vote or ready_for_signing the protocol returns to draft
        (AC-17, AC-26).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found, governance.agenda_item_not_found]
        "409": [governance.draft_changed, governance.protocol_locked, governance.transition_not_allowed]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
        - $ref: "#/components/parameters/AgendaItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAgendaItemWordingRequest" }
            example:
              protocol_revision: 3
              subject: Про затвердження кошторису робіт з ремонту покрівлі
              fragments:
                - text: "Затвердити кошторис робіт на суму "
                - slot_id: 00000000-0000-7000-8000-000000000081
                - text: " з оплатою з фонду ремонту."
      responses:
        "200":
          description: The protocol at its new revision.
