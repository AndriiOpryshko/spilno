    post:
      operationId: askAssistant
      tags: [governance]
      summary: Ask the помічник to reword the draft or to retry a failed draft
      description: |
        Appends a member turn and enqueues assistant_draft (SAD §6 Flow 1, Flow 11 "retry offered").
