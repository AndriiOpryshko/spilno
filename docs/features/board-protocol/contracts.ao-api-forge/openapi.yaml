        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Stale revision, or the protocol is final.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: urn:problem:governance.draft_changed
                title: Чернетку щойно змінив інший член правління; перегляньте нову версію.
                status: 409
                detail: current revision 4
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/protocols/{protocol_id}/agenda-items/{agenda_item_id}/slots:
    post:
      operationId: addDecisionSlot
      tags: [governance]
      summary: Add a слот рішення by hand (origin human, confirmed by its author)
