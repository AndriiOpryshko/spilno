# board-protocol — contract delta for services/core/api/openapi.yaml
# Generated by ao-api-forge (scenario A). Derived, never hand-written:
#   operations       <- PRD.ao-prd.md §4 US-01..US-09, §5 Stage 1 AC
#   fields           <- data-model.md + docs/features/board-protocol/migrations/*.up.sql
#   error responses  <- sad.ao-architecture.md §6 Flows 1-11 alt-branches + PRD §5.1 + PRD §10 refusals
# A self-contained delta: new paths and components plus same-shape copies of the repo components it
# references (Problem, FieldError, NotFound, UnprocessableEntity, Currency). No /api prefix, no version.
openapi: 3.1.0

info:
  title: board-protocol — contract delta
  version: 0.1.0
  description: |
    A член правління turns a кошторис робіт into a signed протокол правління. The помічник протоколу
    drafts the wording and proposes values read from the case documents, each with a link to its
    source; a person confirms every proposed value before the print copy is rendered. The board may
    run an informal попереднє голосування on a frozen wording; it is never the meeting's vote. The
    print copy reserves the protocol number; the signed scan and the meeting facts from the paper
    lock the protocol in the реєстр протоколів. A draft that will not be signed is withdrawn with a
    reason (PRD.ao-prd.md §1, Stage 1).
  x-merge-target: services/core/api/openapi.yaml
  x-generated-by: ao-api-forge

servers:
  - url: http://localhost:8080

tags:
  - name: identity
    description: Google sign-in, sessions and the association record (new context, ADR 0022).
  - name: governance
    description: Board meetings and their decisions.

security:
  - SessionCookie: []

paths:
  # ==== identity ================================================================================
  /identity/sign-in:
    get:
      operationId: startSignIn
      tags: [identity]
      summary: Redirect to Google to sign in
      description: Starts the OIDC authorization-code flow with PKCE (ADR 0022). Public.
      security: []
      x-problem-types:
        "422": [about:blank]
      parameters:
        - name: return_to
          in: query
          description: SPA path to open after sign-in.
          schema: { type: string, minLength: 1, maxLength: 500, pattern: "^/" }
          example: /protocols
      responses:
        "302":
          description: Redirect to the Google authorization endpoint.
          headers:
            Location:
              schema: { type: string }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /identity/sign-in/callback:
    get:
      operationId: completeSignIn
      tags: [identity]
      summary: Finish Google sign-in and open a session for a current член правління
      description: |
        Accepts only an ID token with email_verified = true. The verified e-mail must be the sign-in
        e-mail of a current член правління today (Europe/Kyiv); otherwise no session is created and
        the sign-in page shows governance.not_board_member (SAD §6 Flow 10 note, ADR 0022). Public.
      security: []
      x-problem-types:
        "403": [governance.not_board_member]
        "422": [about:blank]
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "302":
          description: Session created; redirect to the SPA.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              description: The session cookie (HttpOnly, Secure, SameSite=Lax).
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /identity/sign-out:
    post:
      operationId: signOut
      tags: [identity]
      summary: End the current session
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
      responses:
        "204":
          description: The session row is deleted and the cookie cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /identity/session:
    get:
      operationId: getSession
      tags: [identity]
      summary: Who is signed in, for which association, as which roster person
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
      responses:
        "200":
          description: The current actor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                account_id: 00000000-0000-7000-8000-000000000011
                email: member-1@example.test
                association_id: 00000000-0000-7000-8000-000000000001
                board_member_id: 00000000-0000-7000-8000-000000000021
                full_name: Тестовий Член Правління
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==== governance: association settings (US-01, AC-45) =========================================
  /governance/settings:
    get:
      operationId: getAssociationSettings
      tags: [governance]
      summary: Current association settings
      description: Every settings field is null until the first save (AC-45).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationSettings" }
              examples:
                associationSettings: { $ref: "#/components/examples/AssociationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: saveAssociationSettings
      tags: [governance]
      summary: Save the meeting form, signers and the register start number
      description: |
        Appends a settings revision (latest wins). register_start_number may change only while the
        protocol register has issued no number (ADR 0021).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "409": [governance.register_start_locked]
        "422": [about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAssociationSettingsRequest" }
            example:
              meeting_form: засідання за особистої присутності
              signers: головуючий і секретар
              register_start_number: 31
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationSettings" }
              examples:
                associationSettings: { $ref: "#/components/examples/AssociationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ==== governance: board roster (US-01, AC-01) ==================================================
  /governance/board-members:
    get:
      operationId: listBoardMembers
      tags: [governance]
      summary: List board members (each one person's one term), newest first
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: in_force_on
          in: query
          description: Only terms in force on this Europe/Kyiv date (AC-01).
          schema: { type: string, format: date }
          example: "2026-10-20"
      responses:
        "200":
          description: One page of board members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMemberPage" }
              example:
                items:
                  - id: 00000000-0000-7000-8000-000000000021
                    full_name: Тестовий Член Правління
                    sign_in_email: member-1@example.test
                    term_start: "2025-06-01"
                    term_end: "2028-05-31"
                    created_at: "2026-10-20T10:00:00Z"
                    revised_at: "2026-10-20T10:00:00Z"
                    revised_by_member_id: null
                next_cursor: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      operationId: createBoardMember
      tags: [governance]
      summary: Record a board member with a term
      description: term_end, when set, is not before term_start; a violation is a 422 with a pointer to /term_end.
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "422": [about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewBoardMember" }
            example:
              full_name: Тестовий Член Правління
              sign_in_email: member-1@example.test
              term_start: "2025-06-01"
              term_end: "2028-05-31"
      responses:
        "201":
          description: The member was recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
              examples:
                boardMember: { $ref: "#/components/examples/BoardMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/board-members/{board_member_id}:
    put:
      operationId: reviseBoardMember
      tags: [governance]
      summary: Correct a member's name, sign-in e-mail or term (appends a revision)
      description: Ending a term today cuts access on the member's next request (ADR 0022).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.board_member_not_found]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/BoardMemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewBoardMember" }
            example:
              full_name: Тестовий Член Правління
              sign_in_email: member-1@example.test
              term_start: "2025-06-01"
              term_end: "2026-05-31"
      responses:
        "200":
          description: The member with the new revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
              examples:
                boardMember: { $ref: "#/components/examples/BoardMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ==== governance: meeting chair (AC-08) =======================================================
  /governance/meetings/{meeting_id}/chair:
    put:
      operationId: setMeetingChair
      tags: [governance]
      summary: Pick the головуючий of a meeting
      description: |
        The головуючий renders into the wording as {meeting: chair} (AC-08). Like any change to a
        draft's values, it returns a protocol in ready_for_vote or ready_for_signing to draft
        (AC-17, AC-26); a signed protocol refuses it (AC-30).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.meeting_not_found, governance.board_member_not_found]
        "409": [governance.protocol_locked, governance.transition_not_allowed]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMeetingChairRequest" }
            example:
              chair_board_member_id: 00000000-0000-7000-8000-000000000021
      responses:
        "204":
          description: The головуючий is set.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ==== governance: справи and files (US-02, AC-43) =============================================
  /governance/cases:
    get:
      operationId: listCases
      tags: [governance]
      summary: List справи, newest first, one page at a time
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of справи.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasePage" }
              example:
                items:
                  - id: 00000000-0000-7000-8000-000000000051
                    title: Ремонт покрівлі
                    created_by_member_id: 00000000-0000-7000-8000-000000000021
                    created_at: "2026-10-21T08:50:00Z"
                    documents: []
                next_cursor: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      operationId: createCase
      tags: [governance]
      summary: Open a справа for an agenda item
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "422": [about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCase" }
            example:
              title: Ремонт покрівлі
      responses:
        "201":
          description: The справа was opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
              examples:
                case: { $ref: "#/components/examples/Case" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/cases/{case_id}:
    get:
      operationId: getCase
      tags: [governance]
      summary: Get one справа with every document version
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.case_not_found]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The справа.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
              examples:
                case: { $ref: "#/components/examples/Case" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/cases/{case_id}/documents:
    post:
      operationId: addCaseDocument
      tags: [governance]
      summary: Add a document to a справа, optionally as a new version of an earlier one
      description: |
        The file is streamed to the association's Drive while hashed; if Drive fails nothing is saved
        (SAD §6 Flow 11). A new version marks every slot read from the earlier version and the
        wording that cited it needs_review, and returns a protocol in ready_for_vote or
        ready_for_signing to draft (AC-43, SAD §6 Flow 2).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.case_not_found]
        "422": [governance.case_document_invalid, about:blank]
        "503": [governance.storage_unavailable]
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AddCaseDocumentRequest" }
      responses:
        "201":
          description: The document version was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDocument" }
              examples:
                caseDocument: { $ref: "#/components/examples/CaseDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /governance/files/{file_id}:
    get:
      operationId: downloadFile
      tags: [governance]
      summary: Download a case document, print copy or signed scan
      description: Streamed from Drive through core as an attachment; Drive ids never appear on the wire.
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.file_not_found]
        "422": [about:blank]
        "503": [governance.storage_unavailable]
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="koshtorys.pdf"
          content:
            application/octet-stream:
              schema: { $ref: "#/components/schemas/FileContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ==== governance: protocols (US-02..US-08) ====================================================
  /governance/protocols:
    get:
      operationId: listProtocols
      tags: [governance]
      summary: List protocols, newest first, one page at a time
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          description: Only protocols in this state.
          schema: { $ref: "#/components/schemas/ProtocolState" }
      responses:
        "200":
          description: One page of protocols.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtocolPage" }
              example:
                items:
                  - id: 00000000-0000-7000-8000-000000000041
                    meeting_id: 00000000-0000-7000-8000-000000000031
                    meeting_date: "2026-10-20"
                    state: draft
                    revision: 4
                    number: null
                    created_at: "2026-10-21T09:00:00Z"
                next_cursor: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      operationId: createProtocolDraft
      tags: [governance]
      summary: Ask the помічник протоколу for a draft of a meeting's protocol
      description: |
        Creates the protocol in draft with its first agenda item for the справа, members from the
        board in force on the meeting date and no number, and enqueues assistant_draft in the same
        transaction (SAD §6 Flow 1, events.md). assistant_status is pending until the job ends.
        Missing settings are named at once in errors[] (AC-45).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.meeting_not_found, governance.case_not_found]
        "409": [governance.meeting_has_protocol]
        "422": [governance.association_settings_missing, governance.source_document_required, about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProtocol" }
            example:
              meeting_id: 00000000-0000-7000-8000-000000000031
              case_id: 00000000-0000-7000-8000-000000000051
              message: оплата з фонду ремонту
      responses:
        "201":
          description: The draft was created; the помічник is writing it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolPending: { $ref: "#/components/examples/ProtocolPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Settings missing, empty справа, or the body failed validation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: urn:problem:governance.association_settings_missing
                title: "Спершу заповніть налаштування об'єднання: форму засідання за статутом, хто підписує протокол і номер, з якого продовжується реєстр."
                status: 422
                errors:
                  - { pointer: /settings/meeting_form, detail: not set }
                  - { pointer: /settings/register_start_number, detail: not set }

  /governance/protocols/{protocol_id}:
    get:
      operationId: getProtocol
      tags: [governance]
      summary: Get one protocol in any state
      description: |
        A signed or withdrawn protocol is rendered from its fingerprinted snapshot (ADR 0019) and
        carries its meeting facts or withdrawal reason; poll rounds are history (AC-36, AC-46).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      responses:
        "200":
          description: The protocol.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolDraft: { $ref: "#/components/examples/ProtocolDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/protocols/{protocol_id}/agenda-items:
    post:
      operationId: addAgendaItem
      tags: [governance]
      summary: Add an agenda item for another справа and ask the помічник to word it
      description: Enqueues assistant_draft; returns a ready protocol to draft (AC-17, AC-26).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found, governance.case_not_found]
        "409": [governance.draft_changed, governance.protocol_locked, governance.transition_not_allowed]
        "422": [governance.source_document_required, about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddAgendaItemRequest" }
            example:
              protocol_revision: 4
              case_id: 00000000-0000-7000-8000-000000000052
              message: заміна ламп у під'їздах
      responses:
        "200":
          description: The protocol with the new item; the помічник is writing it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolPending: { $ref: "#/components/examples/ProtocolPending" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/protocols/{protocol_id}/assistant-turns:
    get:
      operationId: listAssistantTurns
      tags: [governance]
      summary: The conversation with the помічник протоколу, newest first
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
