        - $ref: "#/components/parameters/ProtocolId"
        - $ref: "#/components/parameters/SlotId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectDecisionSlotRequest" }
            example:
              protocol_revision: 3
              value: { amount_kopiyky: 18450000, currency: UAH }
      responses:
        "200":
          description: The protocol at its new revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolDraft: { $ref: "#/components/examples/ProtocolDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ---- informal poll (US-05) -------------------------------------------------------------------
  /governance/protocols/{protocol_id}/poll-rounds:
    get:
      operationId: listPollRounds
      tags: [governance]
      summary: Poll rounds of a protocol with their informal tallies, newest first
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of rounds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollRoundPage" }
              example:
                items:
                  - id: 00000000-0000-7000-8000-0000000000d2
                    round_number: 2
                    protocol_revision: 6
                    notice: Попереднє внутрішнє опитування правління — не є голосуванням засідання і не замінює його
                    frozen_agenda_items: []
                    tallies: []
                    opened_by_member_id: 00000000-0000-7000-8000-000000000021
                    created_at: "2026-10-22T09:00:00Z"
                    closed_at: null
                    closed_by_member_id: null
                next_cursor: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      operationId: startPollRound
      tags: [governance]
      summary: Freeze the current wording as the next round of the попереднє голосування
      description: draft -> ready_for_vote. Unconfirmed values are shown as unconfirmed and do not block (AC-13).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found]
        "409": [governance.draft_changed, governance.protocol_locked, governance.transition_not_allowed]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolTransitionRequest" }
            example: { protocol_revision: 5 }
      responses:
        "201":
          description: The round is open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollRound" }
              examples:
                pollRound: { $ref: "#/components/examples/PollRound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/protocols/{protocol_id}/poll-rounds/{round_number}/votes/{agenda_item_id}:
    put:
      operationId: castPollVote
      tags: [governance]
      summary: Cast or change one's own informal vote on one agenda item
      description: |
        board_member_id must be the actor (AC-16). The round must be the open round of a protocol in
        ready_for_vote (AC-18). The tally gives no verdict on кворум, majority or adoption (AC-15).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member, governance.vote_on_behalf]
        "404": [governance.protocol_not_found, governance.poll_round_not_found, governance.agenda_item_not_found]
        "409": [governance.voting_not_open]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
        - $ref: "#/components/parameters/RoundNumber"
        - $ref: "#/components/parameters/AgendaItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CastPollVoteRequest" }
            example:
              board_member_id: 00000000-0000-7000-8000-000000000021
              choice: for
      responses:
        "200":
          description: The round with its informal tally.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollRound" }
              examples:
                pollRound: { $ref: "#/components/examples/PollRound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a current член правління, or a vote for another member.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: urn:problem:governance.vote_on_behalf
                title: Кожен член правління голосує лише за себе.
                status: 403
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ---- transitions (US-05..US-08) --------------------------------------------------------------
  /governance/protocols/{protocol_id}/return-to-draft:
    post:
      operationId: returnProtocolToDraft
      tags: [governance]
      summary: «Повернути в чернетку» from ready_for_vote or ready_for_signing
      description: |
        Closes the open round with its votes kept for history (AC-17) or voids the print copy and
        keeps the number (AC-26).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found]
        "409": [governance.draft_changed, governance.protocol_locked, governance.transition_not_allowed]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolTransitionRequest" }
            example: { protocol_revision: 6 }
      responses:
        "200":
          description: The protocol in draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolDraft: { $ref: "#/components/examples/ProtocolDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/protocols/{protocol_id}/ready-for-signing:
    post:
      operationId: markProtocolReadyForSigning
      tags: [governance]
      summary: Freeze the text, reserve the number and render the print copy
      description: |
        draft or ready_for_vote -> ready_for_signing. Refused while a value the помічник proposed is
        unconfirmed or needs_review; errors[] points at every such slot (AC-06). Closes an open poll
        round (AC-25b), takes the next register number when the protocol has none (AC-25, AC-26) and
        enqueues render_pdf; the new print copy is pending until the job issues it (events.md).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found]
        "409": [governance.amount_unconfirmed, governance.draft_changed, governance.protocol_locked, governance.transition_not_allowed]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolTransitionRequest" }
            example: { protocol_revision: 6 }
      responses:
        "200":
          description: The protocol in ready_for_signing with its number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolReadyForSigning: { $ref: "#/components/examples/ProtocolReadyForSigning" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An unconfirmed value, a stale revision or a state that does not allow it.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: urn:problem:governance.amount_unconfirmed
                title: Значення запропоноване помічником і ще не підтверджене людиною.
                status: 409
                errors:
                  - { pointer: /agenda_items/0/slots/0, detail: proposed by the помічник, unconfirmed }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/protocols/{protocol_id}/signed-copy:
    post:
      operationId: signProtocol
      tags: [governance]
      summary: Upload the signed scan with the meeting facts and lock the protocol
      description: |
        ready_for_signing -> signed (AC-28). The meeting facts come from the paper: members present,
        the vote count for every agenda item and whether the paper carries handwritten corrections
        (with a note). Every missing fact is named at once (AC-47). The file is ≤ 20 MB, PDF, JPEG or
        PNG by content (AC-29). Nothing is checked against кворум or majority in Stage 1. Locks with
        a fingerprinted snapshot and enqueues apply_drive_restrictions (SAD §6 Flow 6).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found]
        "409": [governance.transition_not_allowed, governance.protocol_locked, governance.draft_changed]
        "422": [governance.signed_copy_invalid, governance.meeting_facts_required, governance.corrections_note_required, about:blank]
        "503": [governance.storage_unavailable]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SignProtocolRequest" }
            encoding:
              meeting_facts:
                contentType: application/json
      responses:
        "200":
          description: The protocol, signed and locked in the реєстр протоколів.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolSigned: { $ref: "#/components/examples/ProtocolSigned" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Bad file, missing meeting facts or a missing corrections note.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: urn:problem:governance.meeting_facts_required
                title: Внесіть із підписаного примірника присутніх і підсумок голосування за кожним пунктом.
                status: 422
                errors:
                  - { pointer: /meeting_facts/members_present, detail: empty }
                  - { pointer: /meeting_facts/item_votes/1, detail: no vote count for agenda item 2 }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /governance/protocols/{protocol_id}/withdrawal:
    post:
      operationId: withdrawProtocol
      tags: [governance]
      summary: Close a draft as знятий з розгляду with a reason
      description: |
        From draft, ready_for_vote or ready_for_signing; final. Keeps справа, wording versions, poll
        rounds and a reserved number, which is never reused; a print copy is kept as never signed
        (AC-34, AC-34b, AC-34c). A signed protocol cannot be withdrawn (AC-30b).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found]
        "409": [governance.protocol_locked, governance.transition_not_allowed, governance.draft_changed]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawProtocolRequest" }
            example:
              protocol_revision: 6
              reason: не набрано підтримки, переглянути кошторис
      responses:
        "200":
          description: The protocol in withdrawn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolDraft: { $ref: "#/components/examples/ProtocolDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A signed protocol, an already withdrawn one, or a stale revision.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              example:
                type: urn:problem:governance.protocol_locked
                title: Підписаний протокол змінити або зняти не можна; створіть протокол-виправлення.
                status: 409
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /governance/protocols/{protocol_id}/copies:
    post:
      operationId: copyProtocol
      tags: [governance]
      summary: Start a new draft copied from a withdrawn or signed protocol
      description: |
        The offer of AC-35 (new draft from a withdrawn one) and of AC-30 / AC-30b (a new protocol
        that corrects or revokes a signed one). Only a final protocol can be copied.
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "404": [governance.protocol_not_found, governance.meeting_not_found]
        "409": [governance.transition_not_allowed, governance.meeting_has_protocol]
        "422": [governance.association_settings_missing, about:blank]
      parameters:
        - $ref: "#/components/parameters/ProtocolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyProtocolRequest" }
            example:
              meeting_id: 00000000-0000-7000-8000-000000000032
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples:
                protocolDraft: { $ref: "#/components/examples/ProtocolDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ==== governance: реєстр протоколів (US-09, AC-36) ===========================================
  /governance/registry:
    get:
      operationId: searchRegistry
      tags: [governance]
      summary: Search decisions of signed protocols by date, contractor or amount, newest first
      description: |
        One entry per decision (agenda item) of a signed protocol. withdrawn_numbers lists the numbers
        inside this page's number range taken by withdrawn protocols, shown as gaps «знято з
        розгляду»; the withdrawn protocols themselves stay outside the registry (AC-36, ADR 0021).
      x-problem-types:
        "401": [identity.session_required]
        "403": [governance.not_board_member]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: meeting_date_from
          in: query
          schema: { type: string, format: date }
          example: "2026-01-01"
        - name: meeting_date_to
          in: query
          schema: { type: string, format: date }
          example: "2026-12-31"
        - name: counterparty
          in: query
          description: Case-insensitive "contains" match.
          schema: { type: string, minLength: 1, maxLength: 500 }
          example: управляюча компанія
        - name: amount_kopiyky_min
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: amount_kopiyky_max
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: One page of decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryEntryPage" }
              example:
                items:
                  - id: 00000000-0000-7000-8000-0000000000a1
                    protocol_id: 00000000-0000-7000-8000-000000000041
                    agenda_item_id: 00000000-0000-7000-8000-0000000000b1
                    number: 14
                    meeting_date: "2026-10-20"
                    subject: Про затвердження кошторису робіт з ремонту покрівлі
                    counterparty: Тестова управляюча компанія
                    amount_kopiyky: 18450000
                    currency: UAH
                withdrawn_numbers: [12]
                next_cursor: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: spilno_session
      description: |
        HttpOnly, Secure, SameSite=Lax session cookie set after Google sign-in (ADR 0022). The cookie
        holds a random token; Postgres keeps only its SHA-256 (sessions.token_hash).

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor; omit for the first page.
      schema: { type: string, minLength: 1 }
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BoardMemberId:
      name: board_member_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MeetingId:
      name: meeting_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgendaItemId:
      name: agenda_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlotId:
      name: slot_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoundNumber:
      name: round_number
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }

  schemas:
    # ---- identity ------------------------------------------------------------------------------
    Session:
      type: object
      required: [account_id, email, association_id, board_member_id, full_name]
      properties:
        account_id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 320 }
        association_id: { type: string, format: uuid }
        board_member_id:
          type: string
          format: uuid
          description: The roster person whose sign-in e-mail matched (ADR 0022).
        full_name: { type: string, maxLength: 200 }

    # ---- settings ------------------------------------------------------------------------------
    AssociationSettings:
      type: object
      description: The latest settings revision; every field is null until the first save.
      required: [meeting_form, signers, register_start_number, register_start_locked, next_number, updated_at, updated_by_member_id]
      properties:
        meeting_form:
          type: [string, "null"]
          maxLength: 500
          description: The meeting form the charter allows for the board; printed on every copy (AC-45).
        signers:
          type: [string, "null"]
          maxLength: 500
          description: Who signs the protocol, as printed on the copy (AC-45).
        register_start_number:
          type: [integer, "null"]
          format: int32
        register_start_locked:
          type: boolean
          description: True once the register has issued a number; register_start_number can no longer change.
        next_number:
          type: [integer, "null"]
          format: int32
          description: The number the next first print copy takes.
        updated_at:
          type: [string, "null"]
          format: date-time
        updated_by_member_id:
          type: [string, "null"]
          format: uuid
    SaveAssociationSettingsRequest:
      type: object
      additionalProperties: false
      required: [meeting_form, signers, register_start_number]
      properties:
        meeting_form: { type: string, minLength: 1, maxLength: 500 }
        signers: { type: string, minLength: 1, maxLength: 500 }
        register_start_number: { type: integer, format: int32, minimum: 1 }

    # ---- board roster --------------------------------------------------------------------------
    BoardMember:
      type: object
      description: One person's one term; a re-election is a new board member (data-model).
      required: [id, full_name, sign_in_email, term_start, term_end, created_at, revised_at, revised_by_member_id]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, maxLength: 200 }
        sign_in_email: { type: [string, "null"], format: email, maxLength: 320 }
        term_start: { type: string, format: date }
        term_end: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        revised_at:
          type: string
          format: date-time
          description: When the current revision was saved.
        revised_by_member_id: { type: [string, "null"], format: uuid }
    NewBoardMember:
      type: object
      additionalProperties: false
      description: Body of createBoardMember and of reviseBoardMember (a revision replaces every field).
      required: [full_name, term_start]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 200 }
        sign_in_email:
          type: [string, "null"]
          format: email
          maxLength: 320
          description: Google e-mail used to sign in; null for a member who never signs in.
        term_start: { type: string, format: date }
        term_end:
          type: [string, "null"]
          format: date
          description: Not before term_start; null for an open term.
    BoardMemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BoardMember" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.

    SetMeetingChairRequest:
      type: object
      additionalProperties: false
      required: [chair_board_member_id]
      properties:
        chair_board_member_id: { type: string, format: uuid }

    # ---- справи and files ------------------------------------------------------------------------
    FileMediaType:
      type: string
      description: Sniffed from the content, not the extension.
      enum: [application/pdf, image/jpeg, image/png]
    StoredFile:
      type: object
      required: [id, original_name, media_type, size_bytes, sha256, created_at]
      properties:
        id: { type: string, format: uuid }
        original_name: { type: string, maxLength: 255 }
        media_type: { $ref: "#/components/schemas/FileMediaType" }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Hex SHA-256 computed while streaming the upload.
        created_at: { type: string, format: date-time }
    FileContent:
      type: string
      format: binary
      contentMediaType: application/octet-stream
    Case:
      type: object
      required: [id, title, created_by_member_id, created_at, documents]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        created_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        documents:
          type: array
          description: Every document version, newest first.
          items: { $ref: "#/components/schemas/CaseDocument" }
    NewCase:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    CasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Case" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.
    CaseDocument:
      type: object
      required: [id, case_id, file, previous_version_id, superseded_by_id, document_date, created_by_member_id, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        file: { $ref: "#/components/schemas/StoredFile" }
        previous_version_id:
          type: [string, "null"]
          format: uuid
          description: The version this document replaces (AC-43).
        superseded_by_id:
          type: [string, "null"]
          format: uuid
          description: The newer version, when one exists.
        document_date:
          type: [string, "null"]
          format: date
          description: The date written on the document.
        created_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AddCaseDocumentRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          contentMediaType: application/octet-stream
          description: PDF, JPEG or PNG, ≤ 20 MB (PRD §6).
        previous_version_id:
          type: string
          format: uuid
          description: Mark this upload as a new version of that document (AC-43).
        document_date:
          type: string
          format: date

    # ---- protocol ------------------------------------------------------------------------------
    ProtocolState:
      type: string
      description: "UI labels: чернетка, готовий до голосування, готовий до підпису, підписаний, знятий з розгляду."
      enum: [draft, ready_for_vote, ready_for_signing, signed, withdrawn]
    AssistantStatus:
      type: string
      description: State of the latest assistant_draft job of this protocol (events.md).
      enum: [idle, pending, failed]
    ProtocolSummary:
      type: object
      required: [id, meeting_id, meeting_date, state, revision, number, created_at]
      properties:
        id: { type: string, format: uuid }
        meeting_id: { type: string, format: uuid }
        meeting_date:
          type: string
          format: date
          description: Europe/Kyiv date of the meeting's held_at.
        state: { $ref: "#/components/schemas/ProtocolState" }
        revision: { type: integer, format: int32, minimum: 1 }
        number: { type: [integer, "null"], format: int32 }
        created_at: { type: string, format: date-time }
    ProtocolPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProtocolSummary" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.
    Protocol:
      type: object
      required:
        - id
        - meeting_id
        - meeting_date
        - state
        - revision
        - number
        - copied_from_protocol_id
        - chair_board_member_id
        - members
        - agenda_items
        - assistant_status
        - print_copies
        - meeting_facts
        - withdrawal_reason
        - fingerprint
        - created_by_member_id
        - created_at
      properties:
        id: { type: string, format: uuid }
        meeting_id: { type: string, format: uuid }
        meeting_date: { type: string, format: date }
        state: { $ref: "#/components/schemas/ProtocolState" }
        revision:
          type: integer
          format: int32
          minimum: 1
          description: Send it back as protocol_revision with every change (AC-11b).
        number:
          type: [integer, "null"]
          format: int32
          description: Reserved on the first print copy and never cleared (AC-25, AC-26).
        copied_from_protocol_id: { type: [string, "null"], format: uuid }
        chair_board_member_id:
          type: [string, "null"]
          format: uuid
          description: The головуючий picked for the meeting (AC-08).
        members:
          type: array
          description: The board in force on the meeting date (AC-08).
          items: { $ref: "#/components/schemas/BoardMember" }
        agenda_items:
          type: array
          items: { $ref: "#/components/schemas/AgendaItem" }
        assistant_status: { $ref: "#/components/schemas/AssistantStatus" }
        print_copies:
          type: array
          description: Every print copy, newest first; void and never-signed ones are kept (AC-26, AC-34c).
          items: { $ref: "#/components/schemas/PrintCopy" }
        meeting_facts:
          type: array
          maxItems: 1
          description: The meeting facts entered at signing; empty until the protocol is signed (AC-28).
          items: { $ref: "#/components/schemas/MeetingFacts" }
        withdrawal_reason:
          type: [string, "null"]
          description: Set when the protocol is withdrawn (AC-34).
        fingerprint:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: Hex SHA-256 of the canonical snapshot of a signed or withdrawn protocol (ADR 0019).
        created_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    NewProtocol:
      type: object
      additionalProperties: false
      required: [meeting_id, case_id, message]
      properties:
        meeting_id: { type: string, format: uuid }
        case_id:
          type: string
          format: uuid
          description: The справа of the first agenda item; must hold at least one document (AC-04).
        message:
          type: string
          minLength: 1
          description: What the decision is for, in the member's words (AC-03).
    AddAgendaItemRequest:
      type: object
      additionalProperties: false
      required: [protocol_revision, case_id, message]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        case_id: { type: string, format: uuid }
        message: { type: string, minLength: 1 }
    AskAssistantRequest:
      type: object
      additionalProperties: false
      required: [protocol_revision, message]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        message: { type: string, minLength: 1 }
        case_document_ids:
          type: array
          description: Documents attached to this turn.
          items: { type: string, format: uuid }
    AssistantTurnRole:
      type: string
      enum: [member, assistant]
    AssistantTurn:
      type: object
      required: [id, role, author_member_id, message, protocol_revision, case_document_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/AssistantTurnRole" }
        author_member_id:
          type: [string, "null"]
          format: uuid
          description: Null for an assistant turn.
        message: { type: string }
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        case_document_ids:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AssistantTurnPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssistantTurn" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.

    # ---- wording: fragments with slot placeholders (ADR 0017) ----------------------------------
    AgendaItem:
      type: object
      required: [id, position, case_id, subject, fragments, wording_author_member_id, wording_changed_at, wording_needs_review, slots]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, format: int32, minimum: 0, maximum: 32767 }
        case_id: { type: [string, "null"], format: uuid }
        subject: { type: [string, "null"], maxLength: 500 }
        fragments:
          type: array
          items: { $ref: "#/components/schemas/Fragment" }
        wording_author_member_id:
          type: [string, "null"]
          format: uuid
          description: Who saved the current wording; null when the помічник wrote it (AC-11).
        wording_changed_at: { type: string, format: date-time }
        wording_needs_review:
          type: boolean
          description: The помічник's wording cited a document that has a newer version (AC-43); does not block printing.
        slots:
          type: array
          items: { $ref: "#/components/schemas/DecisionSlot" }
    Fragment:
      oneOf:
        - $ref: "#/components/schemas/TextFragment"
        - $ref: "#/components/schemas/SlotFragment"
        - $ref: "#/components/schemas/MeetingFragment"
    TextFragment:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
    SlotFragment:
      type: object
      additionalProperties: false
      required: [slot_id]
      properties:
        slot_id: { type: string, format: uuid }
    MeetingFragment:
      type: object
      additionalProperties: false
      required: [meeting]
      properties:
        meeting: { $ref: "#/components/schemas/MeetingFragmentField" }
    MeetingFragmentField:
      type: string
      enum: [date, chair, members]
    SaveAgendaItemWordingRequest:
      type: object
      additionalProperties: false
      required: [protocol_revision, subject, fragments]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        subject: { type: [string, "null"], maxLength: 500 }
        fragments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Fragment" }

    # ---- слоти рішення ---------------------------------------------------------------------------
    SlotKind:
      type: string
      enum: [amount, counterparty, funding_source, document_ref, date, term, person, votes, non_participation]
    SlotStatus:
      type: string
      description: needs_review counts as unconfirmed for the print gate (AC-06, AC-43).
      enum: [unconfirmed, confirmed, needs_review]
    SlotOrigin:
      type: string
      enum: [ai, document, human]
    SlotCurrency:
      description: Currency of an amount slot; null for other kinds.
      oneOf:
        - $ref: "#/components/schemas/Currency"
        - type: "null"
    DecisionSlot:
      type: object
      required: [id, kind, status, values, confirmations]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/SlotKind" }
        status: { $ref: "#/components/schemas/SlotStatus" }
        values:
          type: array
          description: Every value, newest first; a proposed value stays here after a correction (AC-06b).
          items: { $ref: "#/components/schemas/SlotValue" }
        confirmations:
          type: array
          description: Who confirmed which value and when, newest first.
          items: { $ref: "#/components/schemas/SlotConfirmation" }
    SlotValue:
      type: object
      required: [id, origin, amount_kopiyky, currency, text_value, date_value, date_end_value, person_member_id, source_document_id, source_fragment, assistant_turn_id, author_member_id, created_at]
      properties:
        id: { type: string, format: uuid }
        origin: { $ref: "#/components/schemas/SlotOrigin" }
        amount_kopiyky: { type: [integer, "null"], format: int64 }
        currency: { $ref: "#/components/schemas/SlotCurrency" }
        text_value: { type: [string, "null"], maxLength: 500 }
        date_value: { type: [string, "null"], format: date }
        date_end_value: { type: [string, "null"], format: date }
        person_member_id: { type: [string, "null"], format: uuid }
        source_document_id:
          type: [string, "null"]
          format: uuid
          description: The case document version the value was read from; shown as a link (AC-06).
        source_fragment:
          type: [string, "null"]
          description: The quoted fragment shown next to the value (AC-06).
        assistant_turn_id: { type: [string, "null"], format: uuid }
        author_member_id:
          type: [string, "null"]
          format: uuid
          description: Who typed or corrected it; null for a proposal.
        created_at: { type: string, format: date-time }
    SlotValueInput:
      type: object
      additionalProperties: false
      description: Only the fields of the slot's kind are set; the domain refuses others with a pointer.
      properties:
        amount_kopiyky: { type: integer, format: int64, minimum: 1 }
        currency: { $ref: "#/components/schemas/Currency" }
        text_value: { type: string, minLength: 1, maxLength: 500 }
        date_value: { type: string, format: date }
        date_end_value: { type: string, format: date }
        person_member_id: { type: string, format: uuid }
        source_document_id: { type: string, format: uuid }
    SlotConfirmation:
      type: object
      required: [id, slot_value_id, protocol_revision, confirmed_by_member_id, created_at]
      properties:
        id: { type: string, format: uuid }
        slot_value_id: { type: string, format: uuid }
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        confirmed_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AddDecisionSlotRequest:
      type: object
      additionalProperties: false
      required: [protocol_revision, kind, value]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        kind: { $ref: "#/components/schemas/SlotKind" }
        value: { $ref: "#/components/schemas/SlotValueInput" }
    ConfirmDecisionSlotRequest:
      type: object
      additionalProperties: false
      required: [protocol_revision, slot_value_id]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        slot_value_id:
          type: string
          format: uuid
          description: The value being confirmed — the current one, or after AC-43 the old or the new one.
    CorrectDecisionSlotRequest:
      type: object
      additionalProperties: false
      required: [protocol_revision, value]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        value: { $ref: "#/components/schemas/SlotValueInput" }

    # ---- transitions ---------------------------------------------------------------------------
    ProtocolTransitionRequest:
      type: object
      additionalProperties: false
      description: Body of startPollRound, returnProtocolToDraft and markProtocolReadyForSigning.
      required: [protocol_revision]
      properties:
        protocol_revision:
          type: integer
          format: int32
          minimum: 1
          description: The revision the member saw; a stale one answers 409 governance.draft_changed.
    WithdrawProtocolRequest:
      type: object
      additionalProperties: false
      required: [protocol_revision, reason]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        reason: { type: string, minLength: 1 }
    CopyProtocolRequest:
      type: object
      additionalProperties: false
      required: [meeting_id]
      properties:
        meeting_id:
          type: string
          format: uuid
          description: The meeting of the new draft; it may have no protocol other than withdrawn ones.

    # ---- informal poll -------------------------------------------------------------------------
    PollChoice:
      type: string
      enum: [for, against, abstain]
    PollNotice:
      type: string
      description: The AC-46 label carried by every round and tally.
      enum: ["Попереднє внутрішнє опитування правління — не є голосуванням засідання і не замінює його"]
    PollRound:
      type: object
      required: [id, round_number, protocol_revision, notice, frozen_agenda_items, tallies, opened_by_member_id, created_at, closed_at, closed_by_member_id]
      properties:
        id: { type: string, format: uuid }
        round_number: { type: integer, format: int32, minimum: 1 }
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        notice: { $ref: "#/components/schemas/PollNotice" }
        frozen_agenda_items:
          type: array
          description: The wording and slot values exactly as frozen for this round.
          items: { $ref: "#/components/schemas/AgendaItem" }
        tallies:
          type: array
          description: Per agenda item; no verdict on кворум, majority or adoption (AC-15).
          items: { $ref: "#/components/schemas/PollTally" }
        opened_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        closed_at:
          type: [string, "null"]
          format: date-time
          description: Set when the round is closed; a closed round is history, never counted (AC-17).
        closed_by_member_id: { type: [string, "null"], format: uuid }
    PollTally:
      type: object
      required: [agenda_item_id, for_count, against_count, abstain_count, votes]
      properties:
        agenda_item_id: { type: string, format: uuid }
        for_count: { type: integer, format: int32, minimum: 0 }
        against_count: { type: integer, format: int32, minimum: 0 }
        abstain_count: { type: integer, format: int32, minimum: 0 }
        votes:
          type: array
          description: The latest vote of each member (AC-15).
          items: { $ref: "#/components/schemas/PollVote" }
    PollVote:
      type: object
      required: [board_member_id, choice, created_at]
      properties:
        board_member_id: { type: string, format: uuid }
        choice: { $ref: "#/components/schemas/PollChoice" }
        created_at: { type: string, format: date-time }
    PollRoundPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PollRound" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.
    CastPollVoteRequest:
      type: object
      additionalProperties: false
      required: [board_member_id, choice]
      properties:
        board_member_id:
          type: string
          format: uuid
          description: Must be the actor's own roster id (AC-16).
        choice: { $ref: "#/components/schemas/PollChoice" }

    # ---- print copy and signing ----------------------------------------------------------------
    PrintCopyStatus:
      type: string
      enum: [pending, issued, void, never_signed]
    PrintCopy:
      type: object
      required: [id, protocol_revision, number, status, file_id, requested_by_member_id, created_at, voided_at]
      properties:
        id: { type: string, format: uuid }
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/PrintCopyStatus" }
        file_id:
          type: [string, "null"]
          format: uuid
          description: The rendered PDF (downloadFile); null while pending.
        requested_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        voided_at: { type: [string, "null"], format: date-time }
    MeetingItemVote:
      type: object
      additionalProperties: false
      required: [agenda_item_id, votes_for, votes_against, votes_abstained]
      properties:
        agenda_item_id: { type: string, format: uuid }
        votes_for: { type: integer, format: int32, minimum: 0, maximum: 32767 }
        votes_against: { type: integer, format: int32, minimum: 0, maximum: 32767 }
        votes_abstained: { type: integer, format: int32, minimum: 0, maximum: 32767 }
    MeetingFactsInput:
      type: object
      additionalProperties: false
      description: |
        The facts written on the signed paper. Properties are optional on the wire so the domain can
        name every missing fact at once (AC-47, governance.meeting_facts_required).
      required: [has_handwritten_corrections]
      properties:
        members_present:
          type: array
          items: { type: string, format: uuid }
        item_votes:
          type: array
          items: { $ref: "#/components/schemas/MeetingItemVote" }
        has_handwritten_corrections: { type: boolean }
        corrections_note:
          type: string
          description: Required when has_handwritten_corrections is true (AC-44).
    MeetingFacts:
      type: object
      required: [print_copy_id, signed_scan, members_present, item_votes, has_handwritten_corrections, corrections_note, entered_by_member_id, created_at]
      properties:
        print_copy_id: { type: string, format: uuid }
        signed_scan: { $ref: "#/components/schemas/StoredFile" }
        members_present:
          type: array
          items: { type: string, format: uuid }
        item_votes:
          type: array
          items: { $ref: "#/components/schemas/MeetingItemVote" }
        has_handwritten_corrections: { type: boolean }
        corrections_note: { type: [string, "null"] }
        entered_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    SignProtocolRequest:
      type: object
      required: [protocol_revision, file, meeting_facts]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        file:
          type: string
          format: binary
          contentMediaType: application/octet-stream
          description: The signed scan, PDF, JPEG or PNG, ≤ 20 MB (AC-29).
        meeting_facts: { $ref: "#/components/schemas/MeetingFactsInput" }

    # ---- registry ------------------------------------------------------------------------------
    RegistryEntry:
      type: object
      required: [id, protocol_id, agenda_item_id, number, meeting_date, subject, counterparty, amount_kopiyky, currency]
      properties:
        id: { type: string, format: uuid }
        protocol_id: { type: string, format: uuid }
        agenda_item_id: { type: string, format: uuid }
        number: { type: integer, format: int32 }
        meeting_date: { type: string, format: date }
        subject: { type: string, maxLength: 500 }
        counterparty: { type: [string, "null"], maxLength: 500 }
        amount_kopiyky: { type: [integer, "null"], format: int64 }
        currency: { $ref: "#/components/schemas/SlotCurrency" }
    RegistryEntryPage:
      type: object
      required: [items, withdrawn_numbers, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RegistryEntry" }
        withdrawn_numbers:
          type: array
          description: Numbers in this page's range taken by withdrawn protocols («знято з розгляду»).
          items: { type: integer, format: int32 }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.

    # ---- copies of repo components (same shape) ------------------------------------------------
    Currency:
      type: string
      enum: [UAH, EUR, USD]
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string }
        detail: { type: string }

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Request failed validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: A state invariant or a concurrent change refused the request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:governance.transition_not_allowed
            title: Цей перехід недоступний у поточному стані протоколу.
            status: 409
    Forbidden:
      description: Not a current член правління; the body is the same whether the target exists or not.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:governance.not_board_member
            title: Дія доступна лише члену правління з чинними повноваженнями.
            status: 403
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:identity.session_required
            title: Увійдіть через Google-акаунт.
            status: 401
    ServiceUnavailable:
      description: The file store is down; nothing was saved.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:governance.storage_unavailable
            title: Сховище файлів зараз недоступне; спробуйте завантажити пізніше, нічого не збережено.
            status: 503

