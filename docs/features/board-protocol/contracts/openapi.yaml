              schema: { $ref: "#/components/schemas/AssistantTurnPage" }
              example:
                items: [{"id": "0192f6a0-0000-7000-8000-000000000901", "protocol_id": "0192f6a0-0000-7000-8000-000000000e01", "role": "member", "author_member_id": "0192f6a0-0000-7000-8000-000000000b01", "message": "Затвердити договір на гідроізоляцію покрівлі з ремонтного фонду", "protocol_revision": 1, "case_document_ids": ["0192f6a0-0000-7000-8000-000000000d01", "0192f6a0-0000-7000-8000-000000000d02"], "created_at": "2026-10-27T10:00:00Z"}]
                next_cursor: null
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/protocols/{protocol_id}/agenda-items/{agenda_item_id}/wording:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
      - $ref: "#/components/parameters/AgendaItemId"
    put:
      operationId: saveAgendaItemWording
      tags: [governance]
      summary: Reword an agenda item's subject and text (AC-29, AC-05d, AC-14b, Flows 1, 3)
      description: |
        Any current член правління may edit. Saves a new wording version with its author and time; every
        slot keeps its value and source. A draft готовий до голосування / готовий до підпису returns to
        чернетка: the open round closes, the print copy is voided, the number stays.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendaItemWordingInput" }
            example:
              protocol_revision: 7
              subject: Про затвердження договору на гідроізоляцію покрівлі
              fragments:
                - { text: "Затвердити договір з " }
                - { slot: 0192f6a0-0000-7000-8000-000000001101 }
                - { text: " на суму " }
                - { slot: 0192f6a0-0000-7000-8000-000000001102 }
      responses:
        "200":
          description: The updated protocol.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProtocolEditConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/protocols/{protocol_id}/agenda-items/{agenda_item_id}/slots:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
      - $ref: "#/components/parameters/AgendaItemId"
    post:
      operationId: addDecisionSlot
      tags: [governance]
      summary: Turn a typed fact into a слот рішення by hand (ADR-0011 highlight offer, AC-28)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionSlotInput" }
            example:
              protocol_revision: 7
              kind: funding_source
              value: { text_value: Ремонтний фонд, source_document_id: 0192f6a0-0000-7000-8000-000000000d01 }
      responses:
        "201":
          description: Slot created by a person (origin `human`, confirmed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProtocolEditConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/protocols/{protocol_id}/slots/{slot_id}/confirmation:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
      - $ref: "#/components/parameters/SlotId"
    post:
      operationId: confirmDecisionSlot
      tags: [governance]
      summary: Confirm one value of a slot — the proposed one or an alternative beside it (AC-21, AC-22, AC-28b)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlotConfirmationInput" }
            example: { protocol_revision: 7, slot_value_id: 0192f6a0-0000-7000-8000-000000001201 }
      responses:
        "200":
          description: Slot confirmed; the protocol with its new revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProtocolEditConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/protocols/{protocol_id}/slots/{slot_id}/values:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
      - $ref: "#/components/parameters/SlotId"
    post:
      operationId: correctDecisionSlot
      tags: [governance]
      summary: Correct a slot by hand; a corrected value counts as confirmed (AC-21)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlotCorrectionInput" }
            example:
              protocol_revision: 7
              value: { amount_kopiyky: 18450000, currency: UAH, source_document_id: 0192f6a0-0000-7000-8000-000000000d02 }
      responses:
        "201":
          description: Value stored (origin `human`) and confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProtocolEditConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ─────────────────────── governance: lifecycle ───────────────────────
  /governance/protocols/{protocol_id}/poll-rounds:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: startPollRound
      tags: [governance]
      summary: Freeze the wording as the next round of the попереднє голосування (чернетка → готовий до голосування) (AC-30, Flow 2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolRevisionInput" }
            example: { protocol_revision: 7 }
      responses:
        "201":
          description: Round opened; unconfirmed slots stay shown as unconfirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollRound" }
              examples: { poll_round: { $ref: "#/components/examples/PollRound" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProtocolEditConflict" }
  /governance/protocols/{protocol_id}/poll-rounds/{round_number}/votes:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
      - $ref: "#/components/parameters/RoundNumber"
    put:
      operationId: castPollVote
      tags: [governance]
      summary: Cast or change one's own informal vote on an agenda item (AC-31, AC-05e, AC-32, Flow 2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollVoteInput" }
            example:
              agenda_item_id: 0192f6a0-0000-7000-8000-000000001001
              board_member_id: 0192f6a0-0000-7000-8000-000000000b01
              choice: for
      responses:
        "200":
          description: Vote stored; the round's tally, labelled informal, with no verdict on quorum or majority.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PollRound" }
              examples: { poll_round: { $ref: "#/components/examples/PollRound" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403":
          description: |
            `governance.vote_on_behalf` — `board_member_id` is not the signed-in member (AC-05e); or
            `identity.not_current_member`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                vote_on_behalf: { $ref: "#/components/examples/VoteOnBehalf" }
                not_current_member: { $ref: "#/components/examples/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The poll is open only while the draft is готовий до голосування (AC-32):
            `governance.poll_not_open` (чернетка, готовий до підпису, or a closed round),
            `governance.protocol_locked` (підписаний), `governance.transition_not_allowed` (знятий з розгляду).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                poll_not_open: { $ref: "#/components/examples/PollNotOpen" }
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
                transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/protocols/{protocol_id}/return-to-draft:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: returnProtocolToDraft
      tags: [governance]
      summary: «Повернути в чернетку» (готовий до голосування / готовий до підпису → чернетка) (AC-05d, AC-14b, Flow 3)
      description: |
        Closes the open round with its votes kept and no longer counted, voids the current print copy (copies
        printed earlier must not be signed), keeps the reserved number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolRevisionInput" }
            example: { protocol_revision: 8 }
      responses:
        "200":
          description: Back in чернетка.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProtocolEditConflict" }
  /governance/protocols/{protocol_id}/ready-for-signing:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: markProtocolReadyForSigning
      tags: [governance]
      summary: Mark готовий до підпису — freeze the text, reserve the number, render the print copy (AC-04, AC-21, AC-14c, AC-33, Flow 4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolRevisionInput" }
            example: { protocol_revision: 7 }
      responses:
        "202":
          description: |
            готовий до підпису with its number; the print copy is rendering — poll `getJob`, then the copy
            appears in `print_copies`. An open round is closed; the copy carries no poll result (AC-41).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtocolWithJob" }
              example:
                protocol: {"id": "0192f6a0-0000-7000-8000-000000000e01", "meeting": {"id": "0192f6a0-0000-7000-8000-000000000f01", "held_at": "2026-11-05T16:00:00Z", "meeting_date": "2026-11-05", "chair_board_member_id": "0192f6a0-0000-7000-8000-000000000b01"}, "state": "draft", "revision": 8, "number": 14, "copied_from_protocol_id": null, "created_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-27T10:00:00Z", "roster_in_force": [{"id": "0192f6a0-0000-7000-8000-000000000b02", "full_name": "Test User", "sign_in_email": "user-2@example.test", "term_start": "2025-03-01", "term_end": null, "revised_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "revised_at": "2026-10-27T09:05:00Z"}], "agenda_items": [{"id": "0192f6a0-0000-7000-8000-000000001001", "position": 1, "case_id": "0192f6a0-0000-7000-8000-000000000c01", "subject": "Про затвердження договору на гідроізоляцію покрівлі", "fragments": [{"text": "Затвердити договір з "}, {"slot": "0192f6a0-0000-7000-8000-000000001101"}], "wording_author_member_id": null, "wording_revised_at": "2026-10-27T10:00:20Z", "slots": [{"id": "0192f6a0-0000-7000-8000-000000001101", "kind": "counterparty", "status": "unconfirmed", "values": [{"id": "0192f6a0-0000-7000-8000-000000001201", "origin": "ai", "amount_kopiyky": null, "currency": null, "text_value": "ТОВ Тест Покрівля", "date_value": null, "date_end_value": null, "person_member_id": null, "source_document_id": "0192f6a0-0000-7000-8000-000000000d01", "source_fragment": "Підрядник: ТОВ «Тест Покрівля»", "assistant_turn_id": "0192f6a0-0000-7000-8000-000000000902", "author_member_id": null, "created_at": "2026-10-27T10:00:20Z"}]}]}], "documents": [{"id": "0192f6a0-0000-7000-8000-000000000d02", "case_id": "0192f6a0-0000-7000-8000-000000000c01", "file": {"id": "0192f6a0-0000-7000-8000-000000000702", "original_name": "rakhunok-123.pdf", "media_type": "application/pdf", "size_bytes": 482113, "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "uploaded_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-20T09:10:00Z"}, "previous_version_id": null, "document_date": "2026-10-18", "created_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-20T09:10:00Z"}], "poll_rounds": [], "print_copies": [], "transitions": [{"from_state": null, "to_state": "draft", "revision": 1, "actor_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-27T10:00:00Z"}]}
                job: {"id": 1042, "kind": "governance.propose_draft", "state": "pending", "protocol_id": "0192f6a0-0000-7000-8000-000000000e01", "attempt": 0, "max_attempts": 5, "created_at": "2026-10-27T10:00:00Z", "finalized_at": null}
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `governance.draft_incomplete` — no agenda item or an item without a subject, every part named
            (AC-04); `governance.slot_unconfirmed` — every unconfirmed proposed slot named (AC-21);
            `governance.draft_revision_conflict`; `governance.transition_not_allowed` (already готовий до
            підпису or знятий з розгляду); `governance.protocol_locked`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                draft_incomplete: { $ref: "#/components/examples/DraftIncomplete" }
                slot_unconfirmed: { $ref: "#/components/examples/SlotUnconfirmed" }
                draft_revision_conflict: { $ref: "#/components/examples/DraftRevisionConflict" }
                transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
  /governance/protocols/{protocol_id}/signed-copy:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: lockProtocolWithSignedCopy
      tags: [governance]
      summary: Upload the signed scan with the meeting facts and lock (готовий до підпису → підписаний) (AC-14, AC-34, AC-15, AC-40, AC-16, Flow 5)
      description: |
        The facts are validated before the scan is streamed (ADR-0018); the form starts empty — nothing is
        pre-filled from the poll (AC-41). Quorum, majority and who signed are not checked (AC-14).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SignedCopyUpload" }
            encoding:
              scan: { contentType: "application/pdf, image/jpeg, image/png" }
              meeting_facts: { contentType: application/json }
            example:
              print_copy_id: 0192f6a0-0000-7000-8000-000000001301
              scan: <binary protocol-14-signed.pdf>
              meeting_facts:
                present_member_ids: [0192f6a0-0000-7000-8000-000000000b01, 0192f6a0-0000-7000-8000-000000000b02, 0192f6a0-0000-7000-8000-000000000b03]
                item_votes:
                  - { agenda_item_id: 0192f6a0-0000-7000-8000-000000001001, votes_for: 3, votes_against: 0, votes_abstained: 0 }
                has_handwritten_corrections: true
                corrections_note: У пункті 1 виправлено номер рахунку від руки, підписано всіма присутніми
      responses:
        "201":
          description: Locked and listed in the реєстр протоколів.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedProtocol" }
              examples: { signed_protocol: { $ref: "#/components/examples/SignedProtocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `governance.not_ready_for_signing` — чернетка or готовий до голосування, mark готовий до підпису
            and print first (AC-40); `governance.draft_revision_conflict` — `print_copy_id` is not the current
            print copy; `governance.protocol_locked` (AC-17); `governance.transition_not_allowed` (знятий з розгляду).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                not_ready_for_signing: { $ref: "#/components/examples/NotReadyForSigning" }
                draft_revision_conflict: { $ref: "#/components/examples/DraftRevisionConflict" }
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
                transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }
        "422":
          description: |
            `governance.meeting_facts_missing` — members present or a vote count per item missing, every fact
            named, protocol stays готовий до підпису (AC-34); `governance.correction_note_required` (AC-15);
            `governance.file_invalid` — over 20 MB or not PDF / JPEG / PNG.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                meeting_facts_missing: { $ref: "#/components/examples/MeetingFactsMissing" }
                correction_note_required: { $ref: "#/components/examples/CorrectionNoteRequired" }
                file_invalid: { $ref: "#/components/examples/FileInvalid" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /governance/protocols/{protocol_id}/withdrawal:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: withdrawProtocol
      tags: [governance]
      summary: Close a draft as знятий з розгляду with a reason (AC-35, AC-36, AC-37, AC-38, Flow 9)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawalInput" }
            example: { protocol_revision: 9, reason: Не підписано на засіданні }
      responses:
        "200":
          description: |
            знятий з розгляду; справи, versions, rounds and print copies kept as never signed; a reserved number
            stays with it and shows as a gap in the реєстр протоколів; a never-printed draft takes no number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `governance.protocol_locked` — a signed protocol changes only through a new decision that revokes or
            corrects it (AC-38); `governance.transition_not_allowed` (already withdrawn); `governance.draft_revision_conflict`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
                transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }
                draft_revision_conflict: { $ref: "#/components/examples/DraftRevisionConflict" }
        "422":
          description: Empty reason (`governance.reason_required`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { reason_required: { $ref: "#/components/examples/ReasonRequired" } }
  /governance/protocols/{protocol_id}/copy:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: copyWithdrawnProtocol
      tags: [governance]
      summary: Start a new draft copied from a withdrawn one (AC-39)
      responses:
        "201":
          description: New чернетка for the same meeting with `copied_from_protocol_id` set and no number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The source is not знятий з розгляду, or the meeting already has an open draft (`governance.transition_not_allowed`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" } }

  # ─────────────────────── governance: реєстр протоколів ───────────────────────
  /governance/registry/decisions:
    get:
      operationId: searchRegistry
      tags: [governance]
      summary: Search decisions of signed protocols, newest meeting first (AC-18, Flow 13)
      description: |
        Filters combine with AND. `counterparty` and `subject` match as "contains", case-insensitive.
        `withdrawn_numbers` lists numbers held by знятий з розгляду protocols inside the page's number range,
        shown as gaps marked «знято з розгляду».
      parameters:
        - name: counterparty
          in: query
          schema: { type: string, minLength: 1, maxLength: 500 }
          example: ТОВ Тест Покрівля
        - name: subject
          in: query
          schema: { type: string, minLength: 1, maxLength: 500 }
          example: гідроізоляція
        - name: amount_kopiyky
          in: query
          description: Exact amount.
          schema: { type: integer, format: int64, minimum: 0 }
          example: 18450000
        - name: amount_from_kopiyky
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          example: 10000000
        - name: amount_to_kopiyky
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          example: 20000000
        - name: date_from
          in: query
          schema: { type: string, format: date }
          example: "2026-01-01"
        - name: date_to
          in: query
          schema: { type: string, format: date }
          example: "2026-12-31"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of matching decisions (empty page when nothing matches).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryDecisionPage" }
              example:
                items:
                  - protocol_id: 0192f6a0-0000-7000-8000-000000000e01
                    agenda_item_id: 0192f6a0-0000-7000-8000-000000001001
                    number: 14
                    meeting_date: "2026-11-05"
                    subject: Про затвердження договору на гідроізоляцію покрівлі
                    counterparty: ТОВ Тест Покрівля
                    amount_kopiyky: 18450000
                    currency: UAH
                withdrawn_numbers: [13]
                next_cursor: null
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "422":
          description: A broken filter — range "from" above "to", a bad period (`governance.search_invalid`, every filter named).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { search_invalid: { $ref: "#/components/examples/SearchInvalid" } }
  /governance/registry/protocols/{protocol_id}:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
    get:
      operationId: getSignedProtocol
      tags: [governance]
      summary: Open a signed protocol with its signed copy, meeting facts, cited documents and poll history (AC-18, AC-41, AC-15, Flow 13)
      responses:
        "200":
          description: The signed snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedProtocol" }
              examples: { signed_protocol: { $ref: "#/components/examples/SignedProtocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: spilno_session
      description: Server-side session (ADR-0003); HttpOnly, Secure, SameSite=Lax.

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor; omit for the first page.
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; a retry with the same key within 24 h returns the first result instead of a second turn and upload.
      schema: { type: string, format: uuid }
      example: 0192f6a0-0000-7000-8000-00000000ffff
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MeetingId:
      name: meeting_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BoardMemberId:
      name: board_member_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgendaItemId:
      name: agenda_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlotId:
      name: slot_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoundNumber:
      name: round_number
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    SessionRequired:
      description: No valid session (`identity.session_required`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples: { session_required: { $ref: "#/components/examples/SessionRequired" } }
    NotCurrentMember:
      description: |
        The signed-in person's board term does not cover today (`identity.not_current_member`); the same body
        whether the requested id exists or not (AC-19, AC-16).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples: { not_current_member: { $ref: "#/components/examples/NotCurrentMember" } }
    NotFound:
      description: No such resource in the association.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: about:blank, title: Not Found, status: 404 }
    ValidationFailed:
      description: Request failed validation; every broken field named in `errors`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: about:blank
            title: Validation failed
            status: 422
            errors: [{ pointer: /protocol_revision, detail: property "protocol_revision" is missing }]
    StorageUnavailable:
      description: File storage unavailable; nothing was committed, try again later (`governance.storage_unavailable`, Flow 8).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples: { storage_unavailable: { $ref: "#/components/examples/StorageUnavailable" } }
    ProtocolEditConflict:
      description: |
        `governance.draft_revision_conflict` — the draft changed since the shown revision, reload (ADR-0009);
        `governance.protocol_locked` — signed, changes only through a new decision that references it (AC-17);
        `governance.transition_not_allowed` — знятий з розгляду, offer a new draft copied from it (AC-39), or a
        transition the current state does not allow.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            draft_revision_conflict: { $ref: "#/components/examples/DraftRevisionConflict" }
            protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
            transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }

