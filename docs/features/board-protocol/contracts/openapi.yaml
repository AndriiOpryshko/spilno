# board-protocol — API contract delta (Stage 1), derived by /sdlc:api-forge board-protocol.
#   fields + constraints  ← data-model.md (every field traces to a column; maxLength/enum copied)
#   error responses       ← sad.md §6 Flows 1–13 alt-branches + §8 error catalogue
#   endpoint list + shape ← PRD.md §4 user stories / §5 Stage 1 acceptance criteria
# Self-contained delta: implement-tasks merges these paths and schemas into services/core/api/openapi.yaml
# (one contract per repo, repo ADR 0003), then `mise run gen`. Conventions: .claude/rules/openapi.md
# ("spilno specifics"). Existing operations are untouched except the Meeting schemas (chair_board_member_id).
openapi: 3.1.0

info:
  title: spilno core API — board-protocol delta
  version: 0.1.0
  description: |
    A board chair of a young association writes 15-20 board protocols a year by hand, from contracts,
    invoices and chat approvals; numbers in protocols have no link to their source and signed protocols
    are hard to find later. This API lets a current член правління describe a decision to the помічник
    протоколу with the case documents attached, review and confirm the proposed слоти рішення (each linked
    to the document it came from), run an informal попереднє голосування, print the copy for signing with
    a reserved number, lock the protocol by uploading the signed scan with the meeting facts, withdraw a
    draft, and search the реєстр протоколів (PRD §1–§2, Stage 1). Every operation except sign-in requires a
    session of a person whose board term covers today.

servers:
  - url: http://localhost:8080
    description: Local core API (the SPA reaches it as /api/* through its proxy)

security:
  - SessionCookie: []

tags:
  - name: identity
    description: Sign-in, sessions and the current principal.
  - name: governance
    description: Board meetings and their decisions.

paths:
  # ───────────────────────────── identity ─────────────────────────────
  /identity/sign-in:
    get:
      operationId: startSignIn
      tags: [identity]
      summary: Redirect to the identity provider (OIDC authorization code + PKCE)
      description: ADR-0003. Public. Stores the PKCE verifier and state server-side and redirects.
      security: []
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
              example: https://accounts.example.test/o/oauth2/auth?client_id=test-client&state=test-state
  /identity/sign-in/callback:
    get:
      operationId: completeSignIn
      tags: [identity]
      summary: Finish sign-in, create the session and redirect to the SPA
      description: |
        ADR-0003. Public. The verified email must belong to a roster person whose term covers today's
        Europe/Kyiv date; otherwise no session is created.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          example: <authorization-code>
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          example: <state>
      responses:
        "302":
          description: Session created; redirect to the SPA root.
          headers:
            Location:
              schema: { type: string }
              example: /
            Set-Cookie:
              description: HttpOnly, Secure, SameSite=Lax session cookie.
              schema: { type: string }
              example: spilno_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax
        "401":
          description: Unknown, expired or replayed state — start sign-in again.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { session_required: { $ref: "#/components/examples/SessionRequired" } }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
  /identity/sign-out:
    post:
      operationId: signOut
      tags: [identity]
      summary: Delete the current session
      responses:
        "204":
          description: Session row deleted, cookie cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
              example: spilno_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax
        "401": { $ref: "#/components/responses/SessionRequired" }
  /identity/session:
    get:
      operationId: getSession
      tags: [identity]
      summary: The signed-in person, their roster entry and the association
      responses:
        "200":
          description: The current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
              example:
                account_id: 0192f6a0-0000-7000-8000-000000000a01
                email: user-1@example.test
                board_member_id: 0192f6a0-0000-7000-8000-000000000b01
                full_name: Test User
                association: { id: 00000000-0000-7000-8000-000000000001, name: Test Association }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }

  # ─────────────────────── governance: settings & roster ───────────────────────
  /governance/settings:
    get:
      operationId: getAssociationSettings
      tags: [governance]
      summary: Current association settings (latest saved revision)
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationSettings" }
              examples: { association_settings: { $ref: "#/components/examples/AssociationSettings" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404":
          description: Nothing saved yet (`governance.settings_missing`, every setting named in `errors`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { settings_missing: { $ref: "#/components/examples/SettingsMissing" } }
    put:
      operationId: saveAssociationSettings
      tags: [governance]
      summary: Save a new revision of the association settings (AC-42, Flow 12)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssociationSettingsInput" }
            example:
              meeting_form: Засідання правління в очній формі
              signers: Головуючий і секретар засідання
              register_start_number: 31
      responses:
        "200":
          description: Saved; this revision is now current.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationSettings" }
              examples: { association_settings: { $ref: "#/components/examples/AssociationSettings" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "409":
          description: The start number changed after the first protocol number was issued (ADR-0017).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { register_start_locked: { $ref: "#/components/examples/RegisterStartLocked" } }
        "422":
          description: A setting is missing (`governance.settings_invalid`, every missing setting named at once).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { settings_invalid: { $ref: "#/components/examples/SettingsInvalid" } }
  /governance/board-members:
    get:
      operationId: listBoardMembers
      tags: [governance]
      summary: Board roster with terms, newest entry first (US-01)
      parameters:
        - name: "on"
          in: query
          description: Only members whose term covers this calendar date (roster in force).
          schema: { type: string, format: date }
          example: "2026-11-05"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of roster entries (latest revision of each).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMemberPage" }
              example:
                items: [{"id": "0192f6a0-0000-7000-8000-000000000b02", "full_name": "Test User", "sign_in_email": "user-2@example.test", "term_start": "2025-03-01", "term_end": null, "revised_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "revised_at": "2026-10-27T09:05:00Z"}]
                next_cursor: null
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createBoardMember
      tags: [governance]
      summary: Add a person to the board roster for one term (AC-02, Flow 12)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoardMemberInput" }
            example:
              full_name: Test User
              sign_in_email: user-2@example.test
              term_start: "2025-03-01"
              term_end: null
      responses:
        "201":
          description: Roster entry created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
              examples: { board_member: { $ref: "#/components/examples/BoardMember" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "422":
          description: Term start missing or term end before term start (`governance.roster_entry_invalid`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { roster_entry_invalid: { $ref: "#/components/examples/RosterEntryInvalid" } }
  /governance/board-members/{board_member_id}:
    parameters:
      - $ref: "#/components/parameters/BoardMemberId"
    put:
      operationId: updateBoardMember
      tags: [governance]
      summary: Save a new revision of a roster entry (e.g. the term ends) (AC-02, Flow 12)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoardMemberInput" }
            example:
              full_name: Test User
              sign_in_email: user-2@example.test
              term_start: "2025-03-01"
              term_end: "2027-02-28"
      responses:
        "200":
          description: Revision saved; it is now the current one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
              examples: { board_member: { $ref: "#/components/examples/BoardMember" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Term start missing or term end before term start (`governance.roster_entry_invalid`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { roster_entry_invalid: { $ref: "#/components/examples/RosterEntryInvalid" } }

  # ─────────────────────── governance: cases and files ───────────────────────
  /governance/cases:
    get:
      operationId: listCases
      tags: [governance]
      summary: List справи, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of cases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasePage" }
              example:
                items: [{"id": "0192f6a0-0000-7000-8000-000000000c01", "title": "Гідроізоляція покрівлі, будинок 1", "created_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-20T09:00:00Z"}]
                next_cursor: null
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createCase
      tags: [governance]
      summary: Open a справа (US-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseInput" }
            example: { title: "Гідроізоляція покрівлі, будинок 1" }
      responses:
        "201":
          description: Case created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
              examples: { case: { $ref: "#/components/examples/Case" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/cases/{case_id}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: getCase
      tags: [governance]
      summary: One справа with all its document versions (AC-03, AC-19)
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDetail" }
              example:
                id: 0192f6a0-0000-7000-8000-000000000c01
                title: Гідроізоляція покрівлі, будинок 1
                created_by_member_id: 0192f6a0-0000-7000-8000-000000000b01
                created_at: "2026-10-20T09:00:00Z"
                documents: [{"id": "0192f6a0-0000-7000-8000-000000000d02", "case_id": "0192f6a0-0000-7000-8000-000000000c01", "file": {"id": "0192f6a0-0000-7000-8000-000000000702", "original_name": "rakhunok-123.pdf", "media_type": "application/pdf", "size_bytes": 482113, "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "uploaded_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-20T09:10:00Z"}, "previous_version_id": null, "document_date": "2026-10-18", "created_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-20T09:10:00Z"}]
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
  /governance/cases/{case_id}/documents:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: addCaseDocument
      tags: [governance]
      summary: Upload a document, or a newer version of one, into a справа (US-04, AC-09, Flow 3, Flow 8)
      description: |
        A version with `previous_version_id` marks every slot of an open draft that cites the previous
        version `needs_review`, and returns a готовий до голосування / готовий до підпису draft to чернетка
        (AC-09, AC-05d, AC-14b). The file is streamed to storage before the transaction (Flow 8).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CaseDocumentUpload" }
            encoding:
              file: { contentType: "application/pdf, image/jpeg, image/png" }
            example:
              file: <binary kosztorys.pdf>
              previous_version_id: 0192f6a0-0000-7000-8000-000000000d01
              document_date: "2026-10-18"
      responses:
        "201":
          description: Document version stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDocument" }
              examples: { case_document: { $ref: "#/components/examples/CaseDocument" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            File over 20 MB or not PDF / JPEG / PNG by content (`governance.file_invalid`), or
            `previous_version_id` is not a document of this case.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { file_invalid: { $ref: "#/components/examples/FileInvalid" } }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /governance/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      operationId: downloadFile
      tags: [governance]
      summary: Download a stored file — case document, print copy or signed scan (US-07, Flow 13)
      description: Served as an attachment with `X-Content-Type-Options nosniff`, never inline (SAD §8 Files).
      responses:
        "200":
          description: The file bytes of the pinned revision.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="protocol-14-signed.pdf"
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  # ─────────────────────── governance: drafting ───────────────────────
  /governance/meetings/{meeting_id}/assistant-turns:
    parameters:
      - $ref: "#/components/parameters/MeetingId"
    post:
      operationId: createAssistantTurn
      tags: [governance]
      summary: Ask the помічник протоколу for a draft of the meeting's protocol, or refine it (US-12, Flow 1)
      description: |
        Opens the meeting's protocol draft if it has none (AC-26), otherwise adds the справа as a new agenda
        item to the existing draft (AC-03c) or refines it. Uploaded files become document versions of the
        справа. Answers at once with the job that builds the proposal; poll `getJob` (SAD §4). A change to a
        готовий до голосування / готовий до підпису draft returns it to чернетка (AC-05d, AC-14b).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AssistantTurnInput" }
            encoding:
              files: { contentType: "application/pdf, image/jpeg, image/png" }
            example:
              message: Затвердити договір на гідроізоляцію покрівлі з ремонтного фонду
              case_id: 0192f6a0-0000-7000-8000-000000000c01
              case_document_ids: [0192f6a0-0000-7000-8000-000000000d01, 0192f6a0-0000-7000-8000-000000000d02]
      responses:
        "202":
          description: Turn stored with the draft; the proposal is being built.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantTurnAccepted" }
              example:
                turn: {"id": "0192f6a0-0000-7000-8000-000000000901", "protocol_id": "0192f6a0-0000-7000-8000-000000000e01", "role": "member", "author_member_id": "0192f6a0-0000-7000-8000-000000000b01", "message": "Затвердити договір на гідроізоляцію покрівлі з ремонтного фонду", "protocol_revision": 1, "case_document_ids": ["0192f6a0-0000-7000-8000-000000000d01", "0192f6a0-0000-7000-8000-000000000d02"], "created_at": "2026-10-27T10:00:00Z"}
                protocol_id: 0192f6a0-0000-7000-8000-000000000e01
                job: {"id": 1042, "kind": "governance.propose_draft", "state": "pending", "protocol_id": "0192f6a0-0000-7000-8000-000000000e01", "attempt": 0, "max_attempts": 5, "created_at": "2026-10-27T10:00:00Z", "finalized_at": null}
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `governance.settings_missing` — meeting form, signers or start number not saved, every missing
            setting named (AC-42); `governance.protocol_locked` — the meeting's protocol is already signed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                settings_missing: { $ref: "#/components/examples/SettingsMissing" }
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
        "422":
          description: A file is over 20 MB or not PDF / JPEG / PNG (`governance.file_invalid`), or files are sent without `case_id`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { file_invalid: { $ref: "#/components/examples/FileInvalid" } }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /governance/meetings/{meeting_id}/agenda-items:
    parameters:
      - $ref: "#/components/parameters/MeetingId"
    post:
      operationId: addAgendaItemFromCase
      tags: [governance]
      summary: Open the meeting's draft from a справа, or add the справа as an agenda item (US-02, AC-03c)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgendaItemFromCaseInput" }
            example: { case_id: 0192f6a0-0000-7000-8000-000000000c02 }
      responses:
        "201":
          description: The meeting's draft with the new agenda item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Settings missing (AC-42) or the meeting's protocol is already signed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                settings_missing: { $ref: "#/components/examples/SettingsMissing" }
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJob
      tags: [governance]
      summary: Status of a proposal or print-copy job, polled about every 2 s (SAD §4, Flows 1, 4, 8)
      responses:
        "200":
          description: Job status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples: { job_failed: { $ref: "#/components/examples/JobFailed" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
  /governance/jobs/{job_id}/retry:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: retryJob
      tags: [governance]
      summary: Retry a failed job (Flow 8 "retry offered")
      responses:
        "202":
          description: Job scheduled again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples: { job_pending: { $ref: "#/components/examples/JobPending" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The job is not failed (`governance.transition_not_allowed`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" } }
  /governance/protocols:
    get:
      operationId: listProtocols
      tags: [governance]
      summary: List protocol drafts and protocols, newest first, optionally by state
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ProtocolState" }
          example: draft
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of protocols.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtocolSummaryPage" }
              example:
                items:
                  - id: 0192f6a0-0000-7000-8000-000000000e01
                    meeting_id: 0192f6a0-0000-7000-8000-000000000f01
                    meeting_date: "2026-11-05"
                    state: ready_for_signing
                    revision: 7
                    number: 14
                    created_at: "2026-10-27T10:00:00Z"
                next_cursor: null
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/protocols/{protocol_id}:
    parameters:
      - $ref: "#/components/parameters/ProtocolId"
    get:
      operationId: getProtocol
