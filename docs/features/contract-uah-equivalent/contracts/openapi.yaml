# Delta for services/core/api/openapi.yaml — contract-uah-equivalent.
# Derived from PRD.md (§5, §5.1), sad.md (§6 flows 1-2) and data-model.md. One new operation, one new
# schema, one changed schema (Contract gains `uah_equivalent`), one new response. Everything referenced
# but not defined here (AssociationId, Problem, NotFound, UnprocessableEntity, MemberOrDisabled,
# SessionRequired, Currency) already lives in the merge target. Errors follow .claude/rules/openapi.md:
# RFC 9457 problem+json, `type: about:blank`, the catalogue code in the `code` extension member.
openapi: 3.1.0

info:
  title: contract-uah-equivalent — contract delta
  version: 0.1.0
  description: |
    A contract signed in EUR or USD carries its гривневий еквівалент at the офіційний курс of the signing
    day; a member can ask for it later when the rate could not be read at creation (PRD §1).
  x-merge-target: services/core/api/openapi.yaml

tags:
  - name: finance
    description: Association finances.

security:
  - SessionCookie: []

paths:
  /finance/associations/{association_id}/contracts/{id}/uah-equivalent:
    parameters:
      - $ref: "#/components/parameters/AssociationId"
    post:
      operationId: resolveContractUahEquivalent
      tags: [finance]
      summary: Work out the hryvnia equivalent of a contract that has none yet
      description: |
        Reads the офіційний курс of the contract's signing day and stores the гривневий еквівалент. Computed
        once: a contract that already has an equivalent is returned as stored and the rate source is not
        asked (AC-06), so the call is safe to repeat and needs no `Idempotency-Key`. No request body.
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_current_member, identity.association_disabled]
        "404": [about:blank]
        "409": [finance.equivalent_not_applicable, finance.rate_not_published]
        "422": [about:blank]
        "503": [finance.rate_unavailable]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The contract with its equivalent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
              examples: { contract: { $ref: "#/components/examples/ContractWithUahEquivalent" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/UahEquivalentConflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/RateUnavailable" }

components:
  responses:
    UahEquivalentConflict:
      description: |
        `finance.equivalent_not_applicable` — the contract is in UAH; `finance.rate_not_published` — the NBU
        has no офіційний курс of that currency for the signing day. The contract is unchanged (AC-07).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            equivalent_not_applicable:
              value: { type: about:blank, title: Conflict, status: 409, code: finance.equivalent_not_applicable, detail: the contract is in UAH }
            rate_not_published:
              value: { type: about:blank, title: Conflict, status: 409, code: finance.rate_not_published, detail: the NBU has no official rate of EUR for 2031-01-01 }
    RateUnavailable:
      description: The rate source did not answer or is not configured (`finance.rate_unavailable`); nothing changed, try again later (AC-07).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            rate_unavailable:
              value: { type: about:blank, title: Service Unavailable, status: 503, code: finance.rate_unavailable, detail: the rate source did not answer }

  schemas:
    # CHANGED: `uah_equivalent` added and required (nullable).
    Contract:
      type: object
      required: [id, counterparty, amount_cents, currency, signed_at, ends_at, uah_equivalent, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        counterparty: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        signed_at: { type: string, format: date }
        ends_at: { type: [string, "null"], format: date }
        uah_equivalent:
          description: Null for a UAH contract and while the rate has not been read (AC-03, AC-04).
          oneOf:
            - $ref: "#/components/schemas/UahEquivalent"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    # NEW
    UahEquivalent:
      description: The гривневий еквівалент of a foreign-currency contract and the rate it came from (AC-09).
      type: object
      required: [amount_kopiyky, rate, rate_date, source]
      properties:
        amount_kopiyky:
          type: integer
          format: int64
          description: amount_cents × rate, rounded half up to the kopiyka.
        rate:
          type: string
          pattern: "^\\d+(\\.\\d{1,6})?$"
          description: The офіційний курс as published, hryvnias per one unit of the contract's currency; a decimal string, never a float.
        rate_date:
          type: string
          format: date
          description: The дата курсу; always the contract's signed_at.
        source:
          type: string
          enum: [NBU]

  examples:
    ContractWithUahEquivalent:
      value:
        id: 0193b1c2-7d3e-7a10-9f00-000000000001
        counterparty: Test Contractor LLC
        amount_cents: 125000
        currency: EUR
        signed_at: "2026-10-20"
        ends_at: null
        uah_equivalent: { amount_kopiyky: 6316388, rate: "50.5311", rate_date: "2026-10-20", source: NBU }
        created_at: "2026-10-20T09:00:00Z"
        updated_at: "2026-10-20T09:00:00Z"
