# Local dependencies. Started by mprocs (see /mprocs.yaml) or `mise run infra:up`.
name: spilno

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: spilno
      POSTGRES_PASSWORD: spilno
      POSTGRES_DB: spilno
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spilno -d spilno"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Grafana + OTel collector + Tempo (traces) + Loki (logs) + Prometheus (metrics).
  # Grafana: http://localhost:3000, OTLP HTTP: localhost:4318.
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm-data:/data

volumes:
  postgres-data:
  lgtm-data:
