# Hot reload for local dev; started by mprocs (see /mprocs.yaml).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "tools", "api/bruno"]
  delay = 300
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
