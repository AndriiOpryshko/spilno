openapi: 3.1.0
info:
  title: spilno core API
  version: 0.1.0
  description: >
    Single contract for the core service. Every operation carries exactly one tag naming its
    bounded context; oapi-codegen generates each context's server from its own tag.
servers:
  - url: http://localhost:8080
tags:
  - name: system
    description: Service health and runtime info.
  - name: finance
    description: Association finances.
  - name: governance
    description: Board meetings and their decisions.
paths:
  /system/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report service and dependency health
      responses:
        "200":
          description: All dependencies are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: At least one dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /finance/contracts:
    post:
      operationId: createContract
      tags: [finance]
      summary: Register a contract with a counterparty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewContract" }
      responses:
        "201":
          description: The contract was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listContracts
      tags: [finance]
      summary: List contracts, newest first, one page at a time
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's next_cursor; omit for the first page.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: One page of contracts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractPage" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /finance/contracts/{id}:
    get:
      operationId: getContract
      tags: [finance]
      summary: Get one contract
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /governance/meetings:
    post:
      operationId: createMeeting
      tags: [governance]
      summary: Schedule a board meeting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMeeting" }
      responses:
        "201":
          description: The meeting was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meeting" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listMeetings
      tags: [governance]
      summary: List meetings, newest first, one page at a time
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's next_cursor; omit for the first page.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: One page of meetings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingPage" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /governance/meetings/{id}:
    get:
      operationId: getMeeting
      tags: [governance]
      summary: Get one meeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The meeting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meeting" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
components:
  schemas:
    MeetingKind:
      type: string
      enum: [REGULAR, EXTRAORDINARY]
    NewMeeting:
      type: object
      additionalProperties: false
      required: [title, held_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: "#/components/schemas/MeetingKind"
        held_at:
          type: string
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        location:
          type: [string, "null"]
          maxLength: 200
        quorum_required:
          type: boolean
          default: true
    Meeting:
      type: object
      required: [id, title, kind, held_at, ends_at, location, quorum_required, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
        kind:
          $ref: "#/components/schemas/MeetingKind"
        held_at:
          type: string
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        location:
          type: [string, "null"]
        quorum_required:
          type: boolean
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MeetingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Meeting" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          $ref: "#/components/schemas/DependencyHealth"
    DependencyHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        version:
          type: string
          description: Server version reported by the dependency, when it is up.
    Currency:
      type: string
      enum: [UAH, EUR, USD]
    NewContract:
      type: object
      additionalProperties: false
      required: [counterparty, amount_cents, currency, signed_at]
      properties:
        counterparty: { type: string, minLength: 1, maxLength: 200 }
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          description: Contract value in minor units of currency.
        currency: { $ref: "#/components/schemas/Currency" }
        signed_at: { type: string, format: date }
        ends_at:
          type: [string, "null"]
          format: date
          description: Last day of the contract; on or after signed_at. Null for open-ended.
    Contract:
      type: object
      required: [id, counterparty, amount_cents, currency, signed_at, ends_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        counterparty: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        signed_at: { type: string, format: date }
        ends_at: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContractPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Contract" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string }
        detail: { type: string }
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Request failed validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
