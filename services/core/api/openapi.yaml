openapi: 3.1.0
info:
  title: spilno core API
  version: 0.1.0
  description: >
    Single contract for the core service. Every operation carries exactly one tag naming its
    bounded context; oapi-codegen generates each context's server from its own tag.
servers:
  - url: http://localhost:8080
security:
  - SessionCookie: []

tags:
  - name: system
    description: Service health and runtime info.
  - name: finance
    description: Association finances.
  - name: identity
    description: Sign-in, sessions and the current principal.
  - name: governance
    description: Board meetings and their decisions.
paths:
  /system/health:
    get:
      operationId: getHealth
      security: []
      tags: [system]
      summary: Report service and dependency health
      responses:
        "200":
          description: All dependencies are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: At least one dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /finance/associations/{association_id}/contracts:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
    post:
      operationId: createContract
      tags: [finance]
      summary: Register a contract with a counterparty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewContract" }
      responses:
        "201":
          description: The contract was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listContracts
      tags: [finance]
      summary: List contracts, newest first, one page at a time
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's next_cursor; omit for the first page.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: One page of contracts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractPage" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /finance/associations/{association_id}/contracts/{id}:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
    get:
      operationId: getContract
      tags: [finance]
      summary: Get one contract
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The contract.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /governance/associations/{association_id}/meetings:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
    post:
      operationId: createMeeting
      tags: [governance]
      summary: Schedule a board meeting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMeeting" }
      responses:
        "201":
          description: The meeting was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meeting" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listMeetings
      tags: [governance]
      summary: List meetings, newest first, one page at a time
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's next_cursor; omit for the first page.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: One page of meetings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingPage" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /governance/associations/{association_id}/meetings/{id}:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
    get:
      operationId: getMeeting
      tags: [governance]
      summary: Get one meeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The meeting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meeting" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ───────────────────────────── identity ─────────────────────────────
  /identity/sign-in:
    get:
      operationId: startSignIn
      tags: [identity]
      summary: Redirect to the identity provider (OIDC authorization code + PKCE)
      description: ADR-0003. Public. Stores the PKCE verifier and state server-side and redirects.
      security: []
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
              example: https://accounts.example.test/o/oauth2/auth?client_id=test-client&state=test-state
  /identity/sign-in/callback:
    get:
      operationId: completeSignIn
      tags: [identity]
      summary: Finish sign-in, create the session and redirect to the SPA
      description: |
        ADR-0003, ADR-0004. Public. Any person with a verified email gets a session, on or off a roster;
        the associations they belong to come from `listMemberships`.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          example: <authorization-code>
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          example: <state>
      responses:
        "302":
          description: Session created; redirect to the SPA root.
          headers:
            Location:
              schema: { type: string }
              example: /
            Set-Cookie:
              description: HttpOnly, Secure, SameSite=Lax session cookie.
              schema: { type: string }
              example: spilno_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax
        "401":
          description: Unknown, expired or replayed state — start sign-in again.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { session_required: { $ref: "#/components/examples/SessionRequired" } }
  /identity/sign-out:
    post:
      operationId: signOut
      tags: [identity]
      summary: Delete the current session
      responses:
        "204":
          description: Session row deleted, cookie cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
              example: spilno_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax
        "401": { $ref: "#/components/responses/SessionRequired" }
  /identity/session:
    get:
      operationId: getSession
      tags: [identity]
      summary: The signed-in person; associations come from listMemberships (ADR-0004)
      description: Changed repo operation — a person off every roster now has a session (AC-05), so the principal no longer carries one association.
      x-problem-types:
        "401": [identity.session_required]
      responses:
        "200":
          description: The current principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
              examples: { principal: { $ref: "#/components/examples/Principal" } }
        "401": { $ref: "#/components/responses/SessionRequired" }

  /identity/memberships:
    get:
      operationId: listMemberships
      tags: [identity]
      summary: Associations whose roster has the signed-in person with a term covering today (AC-04d)
      x-problem-types:
        "401": [identity.session_required]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of memberships; empty for an applicant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPage" }
              examples: { memberships: { $ref: "#/components/examples/MembershipPage" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ─────────────────────── applicant: заявки and запити ───────────────────────
  /identity/applications:
    get:
      operationId: listMyApplications
      tags: [identity]
      summary: The signed-in person's заявки and запити, newest first (US-02, AC-05)
      x-problem-types:
        "401": [identity.session_required]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of the person's applications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationPage" }
              examples: { applications: { $ref: "#/components/examples/ApplicationPage" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: fileApplication
      tags: [identity]
      summary: File a заявка на підключення or a запит на передачу with the signed extract (US-01, US-04, Flows 1 and 6)
      description: |
        AC-01, AC-17, AC-19c. Every broken field is named at once with `identity.application_invalid` (AC-02):
        the code, the name, the address, the applicant's full name, a position other than `head`, a term start
        that is missing or later than the filing date, no extract. A term end earlier than the filing date
        answers `identity.term_ended` (AC-30). Any signed-in person may file a запит на передачу, on the roster
        of that association or not (AC-17). A code that is pending by another person is accepted and not
        revealed (AC-04c). `association_id` is set only when a член правління files a запит from the card of the
        association set up by hand (AC-19c). The signature is not checked at filing (AC-03).
      x-problem-types:
        "401": [identity.session_required]
        "409": [identity.association_already_connected, identity.application_already_open, identity.association_not_connected, identity.term_ended]
        "422": [identity.application_invalid, about:blank]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/NewApplication" }
            encoding:
              extract: { contentType: "application/pdf, application/pkcs7-signature, application/vnd.etsi.asic-e+zip" }
            example:
              kind: connection
              edrpou: "12345678"
              association_name: ОСББ «Тестовий Будинок»
              association_address: м. Київ, вул. Тестова, 1
              applicant_full_name: Тестовий Голова Правління
              position: head
              term_start: "2026-03-01"
              extract: <binary vytyah.pdf.p7s>
      responses:
        "201":
          description: Filed; the заявка or запит is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
              examples: { pending: { $ref: "#/components/examples/ApplicationPending" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "409":
          description: The code is connected, the person already has a заявка on it, a запит names an association that is not connected, or the term has ended.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                association_already_connected: { $ref: "#/components/examples/AssociationAlreadyConnected" }
                application_already_open: { $ref: "#/components/examples/ApplicationAlreadyOpen" }
                association_not_connected: { $ref: "#/components/examples/AssociationNotConnected" }
                term_ended: { $ref: "#/components/examples/TermEnded" }
        "422":
          description: Missing or wrong fields, all named (`identity.application_invalid`), or schema validation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { application_invalid: { $ref: "#/components/examples/ApplicationInvalid" } }

  /identity/applications/{application_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: getMyApplication
      tags: [identity]
      summary: One of the person's applications with every filing and decision (AC-05, AC-06, AC-14)
      description: Another person's application answers 404, the same as a missing one.
      x-problem-types:
        "401": [identity.session_required]
        "404": [about:blank]
      responses:
        "200":
          description: The application with its history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
              examples: { rejected: { $ref: "#/components/examples/ApplicationDetailRejected" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /identity/applications/{application_id}/filings:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: refileApplication
      tags: [identity]
      summary: Fix and file a rejected application again (US-02, AC-06, Flow 5)
      description: |
        The filing checks of fileApplication run again (AC-02, AC-30). A заявка на підключення whose code was
        connected meanwhile answers `identity.association_already_connected` (AC-04); a refiled запит на
        передачу is not checked against AC-18 again.
      x-problem-types:
        "401": [identity.session_required]
        "404": [about:blank]
        "409": [identity.application_not_pending, identity.association_already_connected, identity.term_ended]
        "422": [identity.application_invalid, about:blank]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ApplicationRefiling" }
            encoding:
              extract: { contentType: "application/pdf, application/pkcs7-signature, application/vnd.etsi.asic-e+zip" }
            example:
              association_name: ОСББ «Тестовий Будинок»
              association_address: м. Київ, вул. Тестова, 1
              applicant_full_name: Тестовий Голова Правління
              position: head
              term_start: "2026-03-01"
              extract: <binary vytyah-new.pdf.p7s>
      responses:
        "201":
          description: Refiled; the application is pending again with a new filing date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
              examples: { pending: { $ref: "#/components/examples/ApplicationPending" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Only a rejected application can be refiled, the code of a заявка was connected meanwhile, or the term has ended.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                application_not_pending: { $ref: "#/components/examples/ApplicationNotPending" }
                association_already_connected: { $ref: "#/components/examples/AssociationAlreadyConnected" }
                term_ended: { $ref: "#/components/examples/TermEnded" }
        "422":
          description: Missing or wrong fields, all named.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { application_invalid: { $ref: "#/components/examples/ApplicationInvalid" } }

  /identity/applications/{application_id}/filings/{filing_id}/extract:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/FilingId"
    get:
      operationId: downloadMyExtract
      tags: [identity]
      summary: Download the extract the person attached to one filing (ADR-0005)
      x-problem-types:
        "401": [identity.session_required]
        "404": [about:blank]
      responses:
        "200": { $ref: "#/components/responses/ExtractFile" }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────── operator back office (ADR-0001) ───────────────────────
  /identity/operator/applications:
    get:
      operationId: listApplicationsForReview
      tags: [identity]
      summary: The оператор's queue, oldest pending first by default (US-03, US-05, AC-16)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/ApplicationStateFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of applications in the given state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationPage" }
              examples: { queue: { $ref: "#/components/examples/ApplicationPage" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /identity/operator/applications/{application_id}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: getApplicationForReview
      tags: [identity]
      summary: One application with filings, checks, decisions, warnings and competing applications (AC-10, AC-11, AC-11b, AC-04c, AC-19b, AC-28b)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "404": [about:blank]
      responses:
        "200":
          description: The review view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationReview" }
              examples: { review: { $ref: "#/components/examples/ApplicationReview" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "404": { $ref: "#/components/responses/NotFound" }

  /identity/operator/applications/{application_id}/filings/{filing_id}/extract:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
      - $ref: "#/components/parameters/FilingId"
    get:
      operationId: downloadExtractForReview
      tags: [identity]
      summary: Download the extract of a filing to check it outside Спільно (ADR-0005)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "404": [about:blank]
      responses:
        "200": { $ref: "#/components/responses/ExtractFile" }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "404": { $ref: "#/components/responses/NotFound" }

  /identity/operator/applications/{application_id}/checks:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: recordExtractCheck
      tags: [identity]
      summary: Record the оператор's check of the extract of the latest filing (AC-03, AC-10, Flow 2)
      description: Not refused for the оператор's own filing — a recorded check leads to no decision (ADR-0009).
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "404": [about:blank]
        "409": [identity.application_not_pending]
        "422": [about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewExtractCheck" }
            examples: { check: { $ref: "#/components/examples/NewExtractCheck" } }
      responses:
        "201":
          description: Check recorded; warnings are recomputed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractCheck" }
              examples: { check: { $ref: "#/components/examples/ExtractCheck" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The application is already decided.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { application_not_pending: { $ref: "#/components/examples/ApplicationNotPending" } }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /identity/operator/applications/{application_id}/approval:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: approveApplication
      tags: [identity]
      summary: Approve the latest filing — create the association or change its roster (AC-08, AC-16c, AC-19, AC-19c, Flows 2-3)
      description: |
        The оператор's own filing is refused whatever the recorded check says and stays pending (AC-16c, ADR-0009).
        For a запит на передачу: an applicant who already has a current roster entry gets no second entry, that
        entry takes the position голова правління; only the entry of the голова recorded by an earlier approval
        ends (AC-19). A competing запит stays pending and can be approved later as a new transfer (AC-19b), so
        `identity.association_already_connected` is answered only for a заявка на підключення (AC-04c).
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "404": [about:blank]
        "409": [identity.operator_own_application, identity.signature_not_checked, identity.extract_code_mismatch, identity.mismatch_needs_document, identity.application_not_pending, identity.association_already_connected]
        "422": [about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveApplicationRequest" }
            examples: { with_document: { $ref: "#/components/examples/ApproveApplicationRequest" } }
      responses:
        "200":
          description: Approved; the decision and the association it created or transferred.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDecision" }
              examples: { approved: { $ref: "#/components/examples/DecisionApproved" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The оператор's own filing, no recorded check, an extract of another code, an open name mismatch without a document, already decided, or the code was connected by a competing заявка.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                operator_own_application: { $ref: "#/components/examples/OperatorOwnApplication" }
                signature_not_checked: { $ref: "#/components/examples/SignatureNotChecked" }
                extract_code_mismatch: { $ref: "#/components/examples/ExtractCodeMismatch" }
                mismatch_needs_document: { $ref: "#/components/examples/MismatchNeedsDocument" }
                application_not_pending: { $ref: "#/components/examples/ApplicationNotPending" }
                association_already_connected: { $ref: "#/components/examples/AssociationAlreadyConnected" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /identity/operator/applications/{application_id}/rejection:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      operationId: rejectApplication
      tags: [identity]
      summary: Reject the latest filing with a reason the applicant will see (AC-13, AC-14, AC-16c, Flow 8)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "404": [about:blank]
        "409": [identity.application_not_pending, identity.operator_own_application]
        "422": [identity.reason_required, about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectApplicationRequest" }
            examples: { reject: { $ref: "#/components/examples/RejectApplicationRequest" } }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDecision" }
              examples: { rejected: { $ref: "#/components/examples/DecisionRejected" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The application is already decided, or it is the оператор's own filing (it stays pending).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                application_not_pending: { $ref: "#/components/examples/ApplicationNotPending" }
                operator_own_application: { $ref: "#/components/examples/OperatorOwnApplication" }
        "422":
          description: Empty reason.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { reason_required: { $ref: "#/components/examples/ReasonRequiredApplicant" } }

  /identity/operator/associations:
    get:
      operationId: listAssociationsForOperator
      tags: [identity]
      summary: Every association with its state and whether its голова is confirmed by an extract (US-06)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "422": [about:blank]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of associations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorAssociationPage" }
              examples: { associations: { $ref: "#/components/examples/OperatorAssociationPage" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /identity/operator/associations/{association_id}/disabling:
    parameters:
      - $ref: "#/components/parameters/AssociationId"
    post:
      operationId: disableAssociation
      tags: [identity]
      summary: Disable an association with a reason its members will see (AC-21, AC-22, AC-24)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "404": [about:blank]
        "409": [identity.association_state_unchanged]
        "422": [identity.reason_required, about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableAssociationRequest" }
            example: { reason: спір щодо складу правління }
      responses:
        "200":
          description: The association is вимкнене ОСББ.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationStateChange" }
              examples: { disabled: { $ref: "#/components/examples/AssociationDisabledChange" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already disabled.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { association_state_unchanged: { $ref: "#/components/examples/AssociationStateUnchanged" } }
        "422":
          description: Empty reason.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { reason_required: { $ref: "#/components/examples/ReasonRequiredMembers" } }

  /identity/operator/associations/{association_id}/enabling:
    parameters:
      - $ref: "#/components/parameters/AssociationId"
    post:
      operationId: enableAssociation
      tags: [identity]
      summary: Enable a disabled association; every record is as before (AC-23, AC-24)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_operator]
        "404": [about:blank]
        "409": [identity.association_state_unchanged]
      responses:
        "200":
          description: The association is підключене ОСББ again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationStateChange" }
              examples: { enabled: { $ref: "#/components/examples/AssociationEnabledChange" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotOperator" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already connected.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { association_state_unchanged: { $ref: "#/components/examples/AssociationStateUnchanged" } }

  # ─────────────────────── association-scoped (ADR-0002) ───────────────────────
  /identity/associations/{association_id}:
    parameters:
      - $ref: "#/components/parameters/AssociationId"
    get:
      operationId: getAssociationCard
      tags: [identity]
      summary: The association card — state, current голова and the chain of confirmation (US-09, AC-29, AC-21)
      description: |
        A non-member gets the same 403 whether the association exists or not (AC-07). Not on the allow-list of a
        вимкнене ОСББ (ADR-0007, PRD §10): its members get `identity.association_disabled` with the reason (AC-21).
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_current_member, identity.association_disabled]
      responses:
        "200":
          description: The card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationCard" }
              examples: { card: { $ref: "#/components/examples/AssociationCard" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }

  /identity/associations/{association_id}/extracts/{extract_id}:
    parameters:
      - $ref: "#/components/parameters/AssociationId"
      - $ref: "#/components/parameters/ExtractId"
    get:
      operationId: downloadConfirmationExtract
      tags: [identity]
      summary: Download an extract an approved decision of this association relied on (AC-20, AC-29)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_current_member, identity.association_disabled]
        "404": [about:blank]
      responses:
        "200": { $ref: "#/components/responses/ExtractFile" }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }

  /identity/associations/{association_id}/storage-connection:
    parameters:
      - $ref: "#/components/parameters/AssociationId"
    get:
      operationId: getStorageConnection
      tags: [identity]
      summary: Whether the document storage is connected and which account holds the files (AC-27, AC-09)
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_current_member, identity.association_disabled]
      responses:
        "200":
          description: The connection status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageConnection" }
              examples: { connected: { $ref: "#/components/examples/StorageConnection" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
    post:
      operationId: completeStorageConnection
      tags: [identity]
      # unresolved: no response is named for an unknown, expired or replayed `state`, or for a code the
      # provider refuses — PRD §5.1 has no code for it (api-sync-report.md §D, /sdlc:clarify-prd).
      # unresolved: who may replace a connected storage and what happens to the files on the old account is
      # an open question of PRD §8; until it is closed a later connection replaces the stored one (report §D).
      summary: Finish the storage consent the SPA received back from Google (ADR-0008, AC-27, AC-28b)
      description: |
        The SPA's callback route posts the authorization code and state; the state is bound to the session and
        the association. When a storage is already connected, the new account replaces the stored one under the
        same rules and no file is moved (SAD §8, open question of PRD §8).
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_current_member, identity.association_disabled]
        "409": [identity.storage_account_personal]
        "422": [about:blank]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteStorageConnectionRequest" }
            example: { code: <authorization-code>, state: <state> }
      responses:
        "201":
          description: Connected; the `spilno/` folder exists in the account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageConnection" }
              examples: { connected: { $ref: "#/components/examples/StorageConnection" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "409":
          description: The Google account is a member's sign-in account.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { storage_account_personal: { $ref: "#/components/examples/StorageAccountPersonal" } }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /identity/associations/{association_id}/storage-connection/authorization:
    parameters:
      - $ref: "#/components/parameters/AssociationId"
    get:
      operationId: startStorageConnection
      tags: [identity]
      summary: Redirect a член правління to the storage consent (drive.file, offline) — ADR-0008
      x-problem-types:
        "401": [identity.session_required]
        "403": [identity.not_current_member, identity.association_disabled]
      responses:
        "302":
          description: Redirect to the provider's consent screen.
          headers:
            Location:
              schema: { type: string, format: uri }
              example: https://accounts.example.test/o/oauth2/auth?client_id=test-client&state=test-state
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }

  # ─────────────────────── governance: settings & roster ───────────────────────
  /governance/associations/{association_id}/settings:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
    get:
      operationId: getAssociationSettings
      tags: [governance]
      summary: Current association settings (latest saved revision)
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationSettings" }
              examples: { association_settings: { $ref: "#/components/examples/AssociationSettings" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "409":
          description: Nothing saved yet (`governance.settings_missing`, every setting named in `errors`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { settings_missing: { $ref: "#/components/examples/SettingsMissing" } }
    put:
      operationId: saveAssociationSettings
      tags: [governance]
      summary: Save a new revision of the association settings (AC-42, Flow 12)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssociationSettingsInput" }
            example:
              meeting_form: Засідання правління в очній формі
              signers: Головуючий і секретар засідання
              register_start_number: 31
      responses:
        "200":
          description: Saved; this revision is now current.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssociationSettings" }
              examples: { association_settings: { $ref: "#/components/examples/AssociationSettings" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "409":
          description: The start number changed after the first protocol number was issued (ADR-0017).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { register_start_locked: { $ref: "#/components/examples/RegisterStartLocked" } }
        "422":
          description: A setting is missing (`governance.settings_invalid`, every missing setting named at once).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { settings_invalid: { $ref: "#/components/examples/SettingsInvalid" } }
  /governance/associations/{association_id}/board-members:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
    get:
      operationId: listBoardMembers
      tags: [governance]
      summary: Board roster with terms, newest entry first (US-01)
      parameters:
        - name: "on"
          in: query
          description: Only members whose term covers this calendar date (roster in force).
          schema: { type: string, format: date }
          example: "2026-11-05"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of roster entries (latest revision of each).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMemberPage" }
              example:
                items: [{"id": "0192f6a0-0000-7000-8000-000000000b02", "full_name": "Test User", "sign_in_email": "user-2@example.test", "term_start": "2025-03-01", "term_end": null, "revised_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "revised_at": "2026-10-27T09:05:00Z", "position": "member", "decision_id": null}]
                next_cursor: null
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createBoardMember
      tags: [governance]
      summary: Add a person to the board roster for one term (AC-02, Flow 12)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoardMemberInput" }
            example:
              full_name: Test User
              sign_in_email: user-2@example.test
              term_start: "2025-03-01"
              term_end: null
      responses:
        "201":
          description: Roster entry created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
              examples: { board_member: { $ref: "#/components/examples/BoardMember" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "422":
          description: Term start missing or term end before term start (`governance.roster_entry_invalid`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { roster_entry_invalid: { $ref: "#/components/examples/RosterEntryInvalid" } }
  /governance/associations/{association_id}/board-members/{board_member_id}:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/BoardMemberId"
    put:
      operationId: updateBoardMember
      tags: [governance]
      summary: Save a new revision of a roster entry (e.g. the term ends) (AC-02, Flow 12)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoardMemberInput" }
            example:
              full_name: Test User
              sign_in_email: user-2@example.test
              term_start: "2025-03-01"
              term_end: "2027-02-28"
      responses:
        "200":
          description: Revision saved; it is now the current one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
              examples: { board_member: { $ref: "#/components/examples/BoardMember" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Term start missing or term end before term start (`governance.roster_entry_invalid`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { roster_entry_invalid: { $ref: "#/components/examples/RosterEntryInvalid" } }

  # ─────────────────────── governance: cases and files ───────────────────────
  /governance/associations/{association_id}/cases:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
    get:
      operationId: listCases
      tags: [governance]
      summary: List справи, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of cases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CasePage" }
              example:
                items: [{"id": "0192f6a0-0000-7000-8000-000000000c01", "title": "Гідроізоляція покрівлі, будинок 1", "created_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-20T09:00:00Z"}]
                next_cursor: null
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createCase
      tags: [governance]
      summary: Open a справа (US-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseInput" }
            example: { title: "Гідроізоляція покрівлі, будинок 1" }
      responses:
        "201":
          description: Case created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
              examples: { case: { $ref: "#/components/examples/Case" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /governance/associations/{association_id}/cases/{case_id}:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: getCase
      tags: [governance]
      summary: One справа with all its document versions (AC-03, AC-19)
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDetail" }
              example:
                id: 0192f6a0-0000-7000-8000-000000000c01
                title: Гідроізоляція покрівлі, будинок 1
                created_by_member_id: 0192f6a0-0000-7000-8000-000000000b01
                created_at: "2026-10-20T09:00:00Z"
                documents: [{"id": "0192f6a0-0000-7000-8000-000000000d02", "case_id": "0192f6a0-0000-7000-8000-000000000c01", "file": {"id": "0192f6a0-0000-7000-8000-000000000702", "original_name": "rakhunok-123.pdf", "media_type": "application/pdf", "size_bytes": 482113, "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "uploaded_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-20T09:10:00Z"}, "previous_version_id": null, "document_date": "2026-10-18", "created_by_member_id": "0192f6a0-0000-7000-8000-000000000b01", "created_at": "2026-10-20T09:10:00Z"}]
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
  /governance/associations/{association_id}/cases/{case_id}/documents:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: addCaseDocument
      tags: [governance]
      summary: Upload a document, or a newer version of one, into a справа (US-04, AC-09, Flow 3, Flow 8)
      description: |
        A version with `previous_version_id` marks every slot of an open draft that cites the previous
        version `needs_review`, and returns a готовий до голосування / готовий до підпису draft to чернетка
        (AC-09, AC-05d, AC-14b). The file is streamed to storage before the transaction (Flow 8).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CaseDocumentUpload" }
            encoding:
              file: { contentType: "application/pdf, image/jpeg, image/png" }
            example:
              file: <binary kosztorys.pdf>
              previous_version_id: 0192f6a0-0000-7000-8000-000000000d01
              document_date: "2026-10-18"
      responses:
        "201":
          description: Document version stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDocument" }
              examples: { case_document: { $ref: "#/components/examples/CaseDocument" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The association has not connected its document storage (`governance.drive_not_connected`, AC-28).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { drive_not_connected: { $ref: "#/components/examples/DriveNotConnected" } }
        "422":
          description: |
            File over 20 MB or not PDF / JPEG / PNG by content (`governance.file_invalid`), or
            `previous_version_id` is not a document of this case.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { file_invalid: { $ref: "#/components/examples/FileInvalid" } }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /governance/associations/{association_id}/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/FileId"
    get:
      operationId: downloadFile
      tags: [governance]
      summary: Download a stored file — case document, print copy or signed scan (US-07, Flow 13)
      description: Served as an attachment with `X-Content-Type-Options nosniff`, never inline (SAD §8 Files).
      responses:
        "200":
          description: The file bytes of the pinned revision.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="protocol-14-signed.pdf"
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }

  # ─────────────────────── governance: drafting ───────────────────────
  /governance/associations/{association_id}/meetings/{meeting_id}/assistant-turns:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/MeetingId"
    post:
      operationId: createAssistantTurn
      tags: [governance]
      summary: Ask the помічник протоколу for a draft of the meeting's protocol, or refine it (US-12, Flow 1)
      description: |
        Opens the meeting's protocol draft if it has none (AC-26), otherwise adds the справа as a new agenda
        item to the existing draft (AC-03c) or refines it. Uploaded files become document versions of the
        справа. Answers at once with the job that builds the proposal; poll `getJob` (SAD §4). A change to a
        готовий до голосування / готовий до підпису draft returns it to чернетка (AC-05d, AC-14b).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AssistantTurnInput" }
            encoding:
              files: { contentType: "application/pdf, image/jpeg, image/png" }
            example:
              message: Затвердити договір на гідроізоляцію покрівлі з ремонтного фонду
              case_id: 0192f6a0-0000-7000-8000-000000000c01
              case_document_ids: [0192f6a0-0000-7000-8000-000000000d01, 0192f6a0-0000-7000-8000-000000000d02]
      responses:
        "202":
          description: Turn stored with the draft; the proposal is being built.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantTurnAccepted" }
              example:
                turn: {"id": "0192f6a0-0000-7000-8000-000000000901", "protocol_id": "0192f6a0-0000-7000-8000-000000000e01", "role": "member", "author_member_id": "0192f6a0-0000-7000-8000-000000000b01", "message": "Затвердити договір на гідроізоляцію покрівлі з ремонтного фонду", "protocol_revision": 1, "case_document_ids": ["0192f6a0-0000-7000-8000-000000000d01", "0192f6a0-0000-7000-8000-000000000d02"], "created_at": "2026-10-27T10:00:00Z"}
                protocol_id: 0192f6a0-0000-7000-8000-000000000e01
