              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                draft_incomplete: { $ref: "#/components/examples/DraftIncomplete" }
                slot_unconfirmed: { $ref: "#/components/examples/SlotUnconfirmed" }
                draft_revision_conflict: { $ref: "#/components/examples/DraftRevisionConflict" }
                transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
  /governance/associations/{association_id}/protocols/{protocol_id}/signed-copy:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: lockProtocolWithSignedCopy
      tags: [governance]
      summary: Upload the signed scan with the meeting facts and lock (готовий до підпису → підписаний) (AC-14, AC-34, AC-15, AC-40, AC-16, Flow 5)
      description: |
        The facts are validated before the scan is streamed (ADR-0018); the form starts empty — nothing is
        pre-filled from the poll (AC-41). Quorum, majority and who signed are not checked (AC-14).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SignedCopyUpload" }
            encoding:
              scan: { contentType: "application/pdf, image/jpeg, image/png" }
              meeting_facts: { contentType: application/json }
            example:
              print_copy_id: 0192f6a0-0000-7000-8000-000000001301
              scan: <binary protocol-14-signed.pdf>
              meeting_facts:
                present_member_ids: [0192f6a0-0000-7000-8000-000000000b01, 0192f6a0-0000-7000-8000-000000000b02, 0192f6a0-0000-7000-8000-000000000b03]
                item_votes:
                  - { agenda_item_id: 0192f6a0-0000-7000-8000-000000001001, votes_for: 3, votes_against: 0, votes_abstained: 0 }
                has_handwritten_corrections: true
                corrections_note: У пункті 1 виправлено номер рахунку від руки, підписано всіма присутніми
      responses:
        "201":
          description: Locked and listed in the реєстр протоколів.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedProtocol" }
              examples: { signed_protocol: { $ref: "#/components/examples/SignedProtocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `governance.not_ready_for_signing` — чернетка or готовий до голосування, mark готовий до підпису
            and print first (AC-40); `governance.draft_revision_conflict` — `print_copy_id` is not the current
            print copy; `governance.protocol_locked` (AC-17); `governance.transition_not_allowed` (знятий з розгляду).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                not_ready_for_signing: { $ref: "#/components/examples/NotReadyForSigning" }
                draft_revision_conflict: { $ref: "#/components/examples/DraftRevisionConflict" }
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
                transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }
        "422":
          description: |
            `governance.meeting_facts_missing` — members present or a vote count per item missing, every fact
            named, protocol stays готовий до підпису (AC-34); `governance.correction_note_required` (AC-15);
            `governance.file_invalid` — over 20 MB or not PDF / JPEG / PNG.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                meeting_facts_missing: { $ref: "#/components/examples/MeetingFactsMissing" }
                correction_note_required: { $ref: "#/components/examples/CorrectionNoteRequired" }
                file_invalid: { $ref: "#/components/examples/FileInvalid" }
        "503": { $ref: "#/components/responses/StorageUnavailable" }
  /governance/associations/{association_id}/protocols/{protocol_id}/withdrawal:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: withdrawProtocol
      tags: [governance]
      summary: Close a draft as знятий з розгляду with a reason (AC-35, AC-36, AC-37, AC-38, Flow 9)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawalInput" }
            example: { protocol_revision: 9, reason: Не підписано на засіданні }
      responses:
        "200":
          description: |
            знятий з розгляду; справи, versions, rounds and print copies kept as never signed; a reserved number
            stays with it and shows as a gap in the реєстр протоколів; a never-printed draft takes no number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `governance.protocol_locked` — a signed protocol changes only through a new decision that revokes or
            corrects it (AC-38); `governance.transition_not_allowed` (already withdrawn); `governance.draft_revision_conflict`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
                transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }
                draft_revision_conflict: { $ref: "#/components/examples/DraftRevisionConflict" }
        "422":
          description: Empty reason (`governance.reason_required`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { reason_required: { $ref: "#/components/examples/ReasonRequired" } }
  /governance/associations/{association_id}/protocols/{protocol_id}/copy:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/ProtocolId"
    post:
      operationId: copyWithdrawnProtocol
      tags: [governance]
      summary: Start a new draft copied from a withdrawn one (AC-39)
      responses:
        "201":
          description: New чернетка for the same meeting with `copied_from_protocol_id` set and no number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protocol" }
              examples: { protocol: { $ref: "#/components/examples/Protocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/MemberOrDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The source is not знятий з розгляду, or the meeting already has an open draft (`governance.transition_not_allowed`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" } }

  # ─────────────────────── governance: реєстр протоколів ───────────────────────
  /governance/associations/{association_id}/registry/decisions:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
    get:
      operationId: searchRegistry
      tags: [governance]
      summary: Search decisions of signed protocols, newest meeting first (AC-18, Flow 13)
      description: |
        Filters combine with AND. `counterparty` and `subject` match as "contains", case-insensitive.
        `withdrawn_numbers` lists numbers held by знятий з розгляду protocols inside the page's number range,
        shown as gaps marked «знято з розгляду».
      parameters:
        - name: counterparty
          in: query
          schema: { type: string, minLength: 1, maxLength: 500 }
          example: ТОВ Тест Покрівля
        - name: subject
          in: query
          schema: { type: string, minLength: 1, maxLength: 500 }
          example: гідроізоляція
        - name: amount_kopiyky
          in: query
          description: Exact amount.
          schema: { type: integer, format: int64, minimum: 0 }
          example: 18450000
        - name: amount_from_kopiyky
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          example: 10000000
        - name: amount_to_kopiyky
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          example: 20000000
        - name: date_from
          in: query
          schema: { type: string, format: date }
          example: "2026-01-01"
        - name: date_to
          in: query
          schema: { type: string, format: date }
          example: "2026-12-31"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of matching decisions (empty page when nothing matches).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryDecisionPage" }
              example:
                items:
                  - protocol_id: 0192f6a0-0000-7000-8000-000000000e01
                    agenda_item_id: 0192f6a0-0000-7000-8000-000000001001
                    number: 14
                    meeting_date: "2026-11-05"
                    subject: Про затвердження договору на гідроізоляцію покрівлі
                    counterparty: ТОВ Тест Покрівля
                    amount_kopiyky: 18450000
                    currency: UAH
                withdrawn_numbers: [13]
                next_cursor: null
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "422":
          description: A broken filter — range "from" above "to", a bad period (`governance.search_invalid`, every filter named).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples: { search_invalid: { $ref: "#/components/examples/SearchInvalid" } }
  /governance/associations/{association_id}/registry/protocols/{protocol_id}:
    parameters:
      - $ref: '#/components/parameters/AssociationId'
      - $ref: "#/components/parameters/ProtocolId"
    get:
      operationId: getSignedProtocol
      tags: [governance]
      summary: Open a signed protocol with its signed copy, meeting facts, cited documents and poll history (AC-18, AC-41, AC-15, Flow 13)
      responses:
        "200":
          description: The signed snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedProtocol" }
              examples: { signed_protocol: { $ref: "#/components/examples/SignedProtocol" } }
        "401": { $ref: "#/components/responses/SessionRequired" }
        "403": { $ref: "#/components/responses/NotCurrentMember" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: spilno_session
      description: Server-side session (ADR-0003); HttpOnly, Secure, SameSite=Lax.

  parameters:
    AssociationId:
      name: association_id
      in: path
      required: true
      description: The association the resource belongs to.
      schema: { type: string, format: uuid }
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FilingId:
      name: filing_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExtractId:
      name: extract_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationStateFilter:
      name: state
      in: query
      description: Defaults to pending (the queue); pending is ordered oldest first, the others newest first.
      schema: { $ref: "#/components/schemas/ApplicationState" }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor; omit for the first page.
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; a retry with the same key within 24 h returns the first result instead of a second turn and upload.
      schema: { type: string, format: uuid }
      example: 0192f6a0-0000-7000-8000-00000000ffff
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MeetingId:
      name: meeting_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BoardMemberId:
      name: board_member_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgendaItemId:
      name: agenda_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlotId:
      name: slot_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoundNumber:
      name: round_number
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    SessionRequired:
      description: No valid session (`identity.session_required`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples: { session_required: { $ref: "#/components/examples/SessionRequired" } }
    NotCurrentMember:
      description: |
        The signed-in person's board term does not cover today (`identity.not_current_member`); the same body
        whether the requested id exists or not (AC-19, AC-16).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples: { not_current_member: { $ref: "#/components/examples/NotCurrentMember" } }
    NotFound:
      description: No such resource in the association.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: about:blank, title: Not Found, status: 404 }
    ValidationFailed:
      description: Request failed validation; every broken field named in `errors`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: about:blank
            title: Validation failed
            status: 422
            errors: [{ pointer: /protocol_revision, detail: property "protocol_revision" is missing }]
    StorageUnavailable:
      description: File storage unavailable; nothing was committed, try again later (`governance.storage_unavailable`, Flow 8).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples: { storage_unavailable: { $ref: "#/components/examples/StorageUnavailable" } }
    ProtocolEditConflict:
      description: |
        `governance.draft_revision_conflict` — the draft changed since the shown revision, reload (ADR-0009);
        `governance.protocol_locked` — signed, changes only through a new decision that references it (AC-17);
        `governance.transition_not_allowed` — знятий з розгляду, offer a new draft copied from it (AC-39), or a
        transition the current state does not allow.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            draft_revision_conflict: { $ref: "#/components/examples/DraftRevisionConflict" }
            protocol_locked: { $ref: "#/components/examples/ProtocolLocked" }
            transition_not_allowed: { $ref: "#/components/examples/TransitionNotAllowed" }

    UnprocessableEntity:
      description: Request failed validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotOperator:
      description: Only the оператор reaches the back office (`identity.not_operator`, AC-16); a roster membership gives no way in (ADR-0009).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples: { not_operator: { $ref: "#/components/examples/NotOperator" } }
    MemberOrDisabled:
      description: |
        `identity.not_current_member` — not on this association's roster today (same body for a missing
        association, AC-07); `identity.association_disabled` — a member of a вимкнене ОСББ on any operation
        outside the registry reads and the signed-copy download (ADR-0007; AC-21, AC-25). Membership is checked first.
        The оператор role is not asked here: an оператор off the roster gets `identity.not_current_member` like
        anyone, an оператор on the roster is a member and nothing more (AC-16b, ADR-0009).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            not_current_member: { $ref: "#/components/examples/NotCurrentMember" }
            association_disabled: { $ref: "#/components/examples/AssociationDisabled" }
    ExtractFile:
      description: The extract as uploaded, as an attachment with `X-Content-Type-Options nosniff`, never inline (SAD §8 Files).
      headers:
        Content-Disposition:
          schema: { type: string }
          example: attachment; filename="vytyah.pdf.p7s"
        X-Content-Type-Options:
          schema: { type: string, const: nosniff }
      content:
        application/octet-stream:
          schema: { type: string, contentMediaType: application/octet-stream }


