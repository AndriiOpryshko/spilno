  schemas:
    Problem:
      description: |
        RFC 9457 problem details (internal/platform/httpapi). `code` is an extension member
        `<context>.<error_name>`; it is set by a context and absent on a 422 from the shared request validator.
        Delta to the repo schema: adds `code`.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          pattern: "^[a-z]+\\.[a-z_]+$"
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string }
        detail: { type: string }

    # ── shared value types ──
    Currency:
      description: Existing repo schema (finance), reused as slot_values.currency / registry_entries.currency.
      type: string
      enum: [UAH, EUR, USD]
    ProtocolState:
      description: protocols.state (ADR-0009); UI labels чернетка · готовий до голосування · готовий до підпису · підписаний · знятий з розгляду.
      type: string
      enum: [draft, ready_for_vote, ready_for_signing, signed, withdrawn]
    FileRef:
      description: files row. Drive file and revision ids are never exposed (ADR-0005).
      type: object
      additionalProperties: false
      required: [id, original_name, media_type, size_bytes, sha256, uploaded_by_member_id, created_at]
      properties:
        id: { type: string, format: uuid }
        original_name: { type: string, maxLength: 255 }
        media_type: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        size_bytes: { type: integer, format: int64, maximum: 20971520 }
        sha256:
          description: Hex of the 32-byte SHA-256 computed while streaming.
          type: string
          pattern: "^[0-9a-f]{64}$"
        uploaded_by_member_id:
          description: Null for a print copy rendered by the worker.
          type: [string, "null"]
          format: uuid
        created_at: { type: string, format: date-time }

    # ── identity ──
    Principal:
      description: Changed — the signed-in person only; associations from listMemberships (ADR-0004). `is_operator` = the session address equals the configured оператор (ADR-0001); the same person may also have memberships, and neither grant widens the other (ADR-0009).
      type: object
      additionalProperties: false
      required: [account_id, email, is_operator]
      properties:
        account_id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 320 }
        is_operator: { type: boolean }
    Association:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }

    # ── settings & roster ──
    AssociationSettingsInput:
      type: object
      additionalProperties: false
      required: [meeting_form, signers, register_start_number]
      properties:
        meeting_form: { type: string, minLength: 1, maxLength: 500 }
        signers: { type: string, minLength: 1, maxLength: 500 }
        register_start_number: { type: integer, format: int32, minimum: 1 }
    AssociationSettings:
      type: object
      additionalProperties: false
      required: [id, meeting_form, signers, register_start_number, next_number, created_by_member_id, created_at]
      properties:
        id: { type: string, format: uuid }
        meeting_form: { type: string, maxLength: 500 }
        signers: { type: string, maxLength: 500 }
        register_start_number: { type: integer, format: int32 }
        next_number:
          description: protocol_registers.next_number — the number the next first print takes; differs from register_start_number once a number was issued.
          type: integer
          format: int32
        created_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    BoardMemberInput:
      type: object
      additionalProperties: false
      required: [full_name, term_start]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 200 }
        sign_in_email:
          description: Null for a person who never signs in.
          type: [string, "null"]
          format: email
          maxLength: 320
        term_start: { type: string, format: date }
        term_end:
          description: Not before term_start (domain). Null = open term.
          type: [string, "null"]
          format: date
    BoardMember:
      description: board_members + its latest board_member_revisions row.
      type: object
      additionalProperties: false
      required: [id, full_name, sign_in_email, term_start, term_end, revised_by_member_id, revised_at, position, decision_id]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, maxLength: 200 }
        sign_in_email: { type: [string, "null"], format: email, maxLength: 320 }
        term_start: { type: string, format: date }
        term_end: { type: [string, "null"], format: date }
        revised_by_member_id: { type: [string, "null"], format: uuid }
        revised_at: { type: string, format: date-time }
        position: { $ref: "#/components/schemas/BoardPosition" }
        decision_id: { type: [string, "null"], format: uuid }
    BoardMemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BoardMember" }
        next_cursor: { type: [string, "null"] }

    # ── meetings (delta to the existing schemas) ──
    NewMeeting:
      description: Existing schema; delta adds chair_board_member_id.
      type: object
      additionalProperties: false
      required: [title, held_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: "#/components/schemas/MeetingKind" }
        held_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        location: { type: [string, "null"], maxLength: 200 }
        quorum_required: { type: boolean, default: true }
        chair_board_member_id:
          description: "The головуючий rendered by the {meeting: chair} fragment (AC-28)."
          type: [string, "null"]
          format: uuid
    Meeting:
      description: Existing schema; delta adds chair_board_member_id.
      type: object
      required: [id, title, kind, held_at, ends_at, location, quorum_required, chair_board_member_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        kind: { $ref: "#/components/schemas/MeetingKind" }
        held_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        location: { type: [string, "null"] }
        quorum_required: { type: boolean }
        chair_board_member_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MeetingKind:
      description: Existing schema, unchanged.
      type: string
      enum: [REGULAR, EXTRAORDINARY]
    ProtocolMeeting:
      type: object
      additionalProperties: false
      required: [id, held_at, meeting_date, chair_board_member_id]
      properties:
        id: { type: string, format: uuid }
        held_at: { type: string, format: date-time }
        meeting_date:
          description: Europe/Kyiv calendar date of held_at (SAD §8 Dates).
          type: string
          format: date
        chair_board_member_id: { type: [string, "null"], format: uuid }

    # ── cases ──
    CaseInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    Case:
      type: object
      additionalProperties: false
      required: [id, title, created_by_member_id, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        created_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    CaseDetail:
      description: Case with its document versions (a closed shape, so not allOf over Case).
      type: object
      additionalProperties: false
      required: [id, title, created_by_member_id, created_at, documents]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        created_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        documents:
          type: array
          items: { $ref: "#/components/schemas/CaseDocument" }
    CasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Case" }
        next_cursor: { type: [string, "null"] }
    CaseDocumentUpload:
      type: object
      required: [file]
      properties:
        file:
          description: PDF, JPEG or PNG by content, ≤ 20 MB.
          type: string
          contentMediaType: application/octet-stream
        previous_version_id:
          description: The version this one replaces (a revised estimate, an amendment) — AC-09.
          type: string
          format: uuid
        document_date:
          description: The date written on the document; AC-22 picks the latest by it.
          type: string
          format: date
    CaseDocument:
      type: object
      additionalProperties: false
      required: [id, case_id, file, previous_version_id, document_date, created_by_member_id, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        file: { $ref: "#/components/schemas/FileRef" }
        previous_version_id: { type: [string, "null"], format: uuid }
        document_date: { type: [string, "null"], format: date }
        created_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    # ── assistant & jobs ──
    AssistantTurnInput:
      type: object
      required: [message]
      properties:
        message:
          description: Conversation text — confidential, never logged.
          type: string
          minLength: 1
        case_id:
          description: The справа this turn is about; becomes an agenda item if the draft has none for it (AC-03c). Required with files.
          type: string
          format: uuid
        case_document_ids:
          description: Existing document versions of the справа attached to this turn.
          type: array
          items: { type: string, format: uuid }
        files:
          description: New documents uploaded into the справа with this turn; each PDF, JPEG or PNG ≤ 20 MB.
          type: array
          items: { type: string, contentMediaType: application/octet-stream }
    AssistantTurn:
      type: object
      additionalProperties: false
      required: [id, protocol_id, role, author_member_id, message, protocol_revision, case_document_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        protocol_id: { type: string, format: uuid }
        role: { type: string, enum: [member, assistant] }
        author_member_id:
          description: Null for an assistant turn.
          type: [string, "null"]
          format: uuid
        message: { type: string }
        protocol_revision: { type: integer, format: int32 }
        case_document_ids:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AssistantTurnPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssistantTurn" }
        next_cursor: { type: [string, "null"] }
    AssistantTurnAccepted:
      type: object
      additionalProperties: false
      required: [turn, protocol_id, job]
      properties:
        turn: { $ref: "#/components/schemas/AssistantTurn" }
        protocol_id: { type: string, format: uuid }
        job: { $ref: "#/components/schemas/Job" }
    Job:
      description: |
        A River job (ADR-0006) the SPA polls. `state` folds River's states: available/scheduled/retryable →
        pending, running → running, completed → completed, discarded/cancelled → failed.
      type: object
      additionalProperties: false
      required: [id, kind, state, protocol_id, attempt, max_attempts, created_at, finalized_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [governance.propose_draft, governance.render_print_copy] }
        state: { type: string, enum: [pending, running, completed, failed] }
        protocol_id: { type: string, format: uuid }
        attempt: { type: integer, format: int32 }
        max_attempts: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        finalized_at: { type: [string, "null"], format: date-time }

    # ── protocol aggregate ──
    ProtocolRevisionInput:
      type: object
      additionalProperties: false
      required: [protocol_revision]
      properties:
        protocol_revision:
          description: The revision the request was built on (ADR-0009).
          type: integer
          format: int32
          minimum: 1
    AgendaItemFromCaseInput:
      type: object
      additionalProperties: false
      required: [case_id]
      properties:
        case_id: { type: string, format: uuid }
    TextFragment:
      description: ADR-0011 — a plain text fragment, a slot placeholder, or a meeting fact.
      oneOf:
        - type: object
          additionalProperties: false
          required: [text]
          properties:
            text: { type: string }
        - type: object
          additionalProperties: false
          required: [slot]
          properties:
            slot: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [meeting]
          properties:
            meeting: { type: string, enum: [date, chair, present] }
    AgendaItemWordingInput:
      type: object
      additionalProperties: false
      required: [protocol_revision, subject, fragments]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        subject:
          description: Null allowed in a draft; refused at готовий до підпису (AC-04).
          type: [string, "null"]
          maxLength: 500
        fragments:
          type: array
          items: { $ref: "#/components/schemas/TextFragment" }
    SlotKind:
      description: decision_slots.kind (AC-28 list).
      type: string
      enum: [amount, counterparty, funding_source, document_ref, date, term, person, votes, non_participation]
    SlotStatus:
      description: decision_slots.status — the AC-21 print gate reads it.
      type: string
      enum: [unconfirmed, confirmed, needs_review]
    SlotOrigin:
      type: string
      enum: [ai, document, human]
    SlotValueInput:
      description: Only the fields of the slot's kind are set (checked in governance/domain).
      type: object
      additionalProperties: false
      properties:
        amount_kopiyky: { type: [integer, "null"], format: int64 }
        currency:
          oneOf:
            - $ref: "#/components/schemas/Currency"
            - type: "null"
        text_value: { type: [string, "null"], maxLength: 500 }
        date_value: { type: [string, "null"], format: date }
        date_end_value: { type: [string, "null"], format: date }
        person_member_id: { type: [string, "null"], format: uuid }
        source_document_id: { type: [string, "null"], format: uuid }
    SlotValue:
      type: object
      additionalProperties: false
      required: [id, origin, amount_kopiyky, currency, text_value, date_value, date_end_value, person_member_id, source_document_id, source_fragment, assistant_turn_id, author_member_id, created_at]
      properties:
        id: { type: string, format: uuid }
        origin: { $ref: "#/components/schemas/SlotOrigin" }
        amount_kopiyky: { type: [integer, "null"], format: int64 }
        currency:
          oneOf:
            - $ref: "#/components/schemas/Currency"
            - type: "null"
        text_value: { type: [string, "null"], maxLength: 500 }
        date_value: { type: [string, "null"], format: date }
        date_end_value: { type: [string, "null"], format: date }
        person_member_id: { type: [string, "null"], format: uuid }
        source_document_id:
          description: The case document version the value came from (AC-21, AC-09).
          type: [string, "null"]
          format: uuid
        source_fragment:
          description: Quoted fragment shown next to the value (AC-21).
          type: [string, "null"]
        assistant_turn_id: { type: [string, "null"], format: uuid }
        author_member_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    SlotConfirmation:
      type: object
      additionalProperties: false
      required: [slot_value_id, protocol_revision, confirmed_by_member_id, created_at]
      properties:
        slot_value_id: { type: string, format: uuid }
        protocol_revision: { type: integer, format: int32 }
        confirmed_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    DecisionSlot:
      description: A слот рішення; `confirmation` is the latest one and is absent while the slot was never confirmed.
      type: object
      additionalProperties: false
      required: [id, kind, status, values]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/SlotKind" }
        status: { $ref: "#/components/schemas/SlotStatus" }
        values:
          description: Every value, newest first — the proposal, alternatives from other documents (AC-22) and a new value beside a confirmed one (AC-28b, AC-09).
          type: array
          items: { $ref: "#/components/schemas/SlotValue" }
        confirmation: { $ref: "#/components/schemas/SlotConfirmation" }
    DecisionSlotInput:
      type: object
      additionalProperties: false
      required: [protocol_revision, kind, value]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        kind: { $ref: "#/components/schemas/SlotKind" }
        value: { $ref: "#/components/schemas/SlotValueInput" }
    SlotConfirmationInput:
      type: object
      additionalProperties: false
      required: [protocol_revision, slot_value_id]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        slot_value_id: { type: string, format: uuid }
    SlotCorrectionInput:
      type: object
      additionalProperties: false
      required: [protocol_revision, value]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        value: { $ref: "#/components/schemas/SlotValueInput" }
    AgendaItem:
      type: object
      additionalProperties: false
      required: [id, position, case_id, subject, fragments, wording_author_member_id, wording_revised_at, slots]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, format: int32, minimum: 1, maximum: 32767 }
        case_id: { type: [string, "null"], format: uuid }
        subject: { type: [string, "null"], maxLength: 500 }
        fragments:
          type: array
          items: { $ref: "#/components/schemas/TextFragment" }
        wording_author_member_id:
          description: Author of the current wording version; null = помічник протоколу (AC-29).
          type: [string, "null"]
          format: uuid
        wording_revised_at: { type: string, format: date-time }
        slots:
          type: array
          items: { $ref: "#/components/schemas/DecisionSlot" }
    ProtocolTransition:
      type: object
      additionalProperties: false
      required: [from_state, to_state, revision, actor_member_id, created_at]
      properties:
        from_state:
          oneOf:
            - $ref: "#/components/schemas/ProtocolState"
            - type: "null"
        to_state: { $ref: "#/components/schemas/ProtocolState" }
        revision: { type: integer, format: int32 }
        actor_member_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    PollChoice:
      type: string
      enum: [for, against, abstain]
    PollVoteInput:
      type: object
      additionalProperties: false
      required: [agenda_item_id, board_member_id, choice]
      properties:
        agenda_item_id: { type: string, format: uuid }
        board_member_id:
          description: Must be the signed-in member (AC-05e).
          type: string
          format: uuid
        choice: { $ref: "#/components/schemas/PollChoice" }
    PollVote:
      type: object
      additionalProperties: false
      required: [board_member_id, choice, created_at]
      properties:
        board_member_id: { type: string, format: uuid }
        choice: { $ref: "#/components/schemas/PollChoice" }
        created_at: { type: string, format: date-time }
    PollTally:
      type: object
      additionalProperties: false
      required: [for, against, abstain]
      properties:
        for: { type: integer, format: int32, minimum: 0 }
        against: { type: integer, format: int32, minimum: 0 }
        abstain: { type: integer, format: int32, minimum: 0 }
    PollRoundItem:
      type: object
      additionalProperties: false
      required: [agenda_item_id, tally, votes]
      properties:
        agenda_item_id: { type: string, format: uuid }
        tally: { $ref: "#/components/schemas/PollTally" }
        votes:
          description: Latest vote of each member in this round.
          type: array
          items: { $ref: "#/components/schemas/PollVote" }
    PollRound:
      description: One round of the попереднє голосування; never a verdict on quorum, majority or adoption (AC-31, AC-41).
      type: object
      additionalProperties: false
      required: [id, round_number, protocol_revision, label, opened_by_member_id, created_at, closed_at, closed_by_member_id, frozen_agenda_items, items]
      properties:
        id: { type: string, format: uuid }
        round_number: { type: integer, format: int32, minimum: 1 }
        protocol_revision: { type: integer, format: int32 }
        label:
          type: string
          const: Попереднє внутрішнє опитування правління — не є голосуванням засідання і не замінює його
        opened_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        closed_by_member_id: { type: [string, "null"], format: uuid }
        frozen_agenda_items:
          description: The wording and slot values the round was opened on (poll_rounds.frozen).
          type: array
          items: { $ref: "#/components/schemas/AgendaItem" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PollRoundItem" }
    PrintCopy:
      type: object
      additionalProperties: false
      required: [id, protocol_revision, number, file, requested_by_member_id, created_at, voided_at]
      properties:
        id: { type: string, format: uuid }
        protocol_revision: { type: integer, format: int32 }
        number: { type: integer, format: int32 }
        file: { $ref: "#/components/schemas/FileRef" }
        requested_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        voided_at:
          description: Set when an edit voided the copy — it must not be signed (AC-14b).
          type: [string, "null"]
          format: date-time
    Protocol:
      description: The protocol aggregate in its current state (draft view).
      type: object
      additionalProperties: false
      required: [id, meeting, state, revision, number, copied_from_protocol_id, created_by_member_id, created_at, roster_in_force, agenda_items, documents, poll_rounds, print_copies, transitions]
      properties:
        id: { type: string, format: uuid }
        meeting: { $ref: "#/components/schemas/ProtocolMeeting" }
        state: { $ref: "#/components/schemas/ProtocolState" }
        revision: { type: integer, format: int32, minimum: 1 }
        number:
          description: Reserved at the first print copy, never cleared (ADR-0017).
          type: [integer, "null"]
          format: int32
        copied_from_protocol_id: { type: [string, "null"], format: uuid }
        created_by_member_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        roster_in_force:
          description: Board members whose term covers the meeting date (AC-03).
          type: array
          items: { $ref: "#/components/schemas/BoardMember" }
        agenda_items:
          type: array
          items: { $ref: "#/components/schemas/AgendaItem" }
        documents:
          description: Document versions of the справи behind the agenda items (AC-03).
          type: array
          items: { $ref: "#/components/schemas/CaseDocument" }
        poll_rounds:
          description: Every round, newest first; closed rounds are history and not counted (AC-05d).
          type: array
          items: { $ref: "#/components/schemas/PollRound" }
        print_copies:
          description: Every rendered copy, newest first; only a copy with voided_at null may be signed.
          type: array
          items: { $ref: "#/components/schemas/PrintCopy" }
        transitions:
          type: array
          items: { $ref: "#/components/schemas/ProtocolTransition" }
    ProtocolWithJob:
      type: object
      additionalProperties: false
      required: [protocol, job]
      properties:
        protocol: { $ref: "#/components/schemas/Protocol" }
        job: { $ref: "#/components/schemas/Job" }
    ProtocolSummary:
      type: object
      additionalProperties: false
      required: [id, meeting_id, meeting_date, state, revision, number, created_at]
      properties:
        id: { type: string, format: uuid }
        meeting_id: { type: string, format: uuid }
        meeting_date: { type: string, format: date }
        state: { $ref: "#/components/schemas/ProtocolState" }
        revision: { type: integer, format: int32 }
        number: { type: [integer, "null"], format: int32 }
        created_at: { type: string, format: date-time }
    ProtocolSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProtocolSummary" }
        next_cursor: { type: [string, "null"] }

    # ── signing ──
    MeetingItemVotes:
      type: object
      additionalProperties: false
      required: [agenda_item_id, votes_for, votes_against, votes_abstained]
      properties:
        agenda_item_id: { type: string, format: uuid }
        votes_for: { type: integer, format: int32, minimum: 0, maximum: 32767 }
        votes_against: { type: integer, format: int32, minimum: 0, maximum: 32767 }
        votes_abstained: { type: integer, format: int32, minimum: 0, maximum: 32767 }
    MeetingFactsInput:
      description: Facts written on the signed paper; never pre-filled from the poll (AC-41, ADR-0018). Completeness is checked in the domain so every missing fact is named at once (AC-34).
      type: object
      additionalProperties: false
      required: [present_member_ids, item_votes, has_handwritten_corrections]
      properties:
        present_member_ids:
          description: Members present — a subset of the roster in force on the meeting date.
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        item_votes:
          description: One entry per agenda item.
          type: array
          items: { $ref: "#/components/schemas/MeetingItemVotes" }
        has_handwritten_corrections: { type: boolean }
        corrections_note:
          description: Required when has_handwritten_corrections (AC-15).
          type: [string, "null"]
    SignedCopyUpload:
      type: object
      required: [print_copy_id, scan, meeting_facts]
      properties:
        print_copy_id:
          description: The current (not voided) print copy that was signed.
          type: string
          format: uuid
        scan:
          description: PDF, JPEG or PNG by content, ≤ 20 MB.
          type: string
          contentMediaType: application/octet-stream
        meeting_facts: { $ref: "#/components/schemas/MeetingFactsInput" }
    MeetingFacts:
      type: object
      additionalProperties: false
      required: [signed_scan, present_member_ids, item_votes, has_handwritten_corrections, corrections_note, entered_by_member_id, entered_at]
      properties:
        signed_scan: { $ref: "#/components/schemas/FileRef" }
        present_member_ids:
          type: array
          items: { type: string, format: uuid }
        item_votes:
          type: array
          items: { $ref: "#/components/schemas/MeetingItemVotes" }
        has_handwritten_corrections: { type: boolean }
        corrections_note:
          description: Shown next to the frozen text; the signed paper prevails (AC-15).
          type: [string, "null"]
        entered_by_member_id: { type: string, format: uuid }
        entered_at: { type: string, format: date-time }
    WithdrawalInput:
      type: object
      additionalProperties: false
      required: [protocol_revision, reason]
      properties:
        protocol_revision: { type: integer, format: int32, minimum: 1 }
        reason:
          description: Kept in the withdrawn snapshot (ADR-0007).
          type: string
          minLength: 1

    # ── реєстр протоколів ──
    SignedProtocol:
      description: Read from the signed protocol_snapshots row (ADR-0007); nothing here changes after lock.
      type: object
      additionalProperties: false
      required: [protocol_id, number, meeting_date, meeting, agenda_items, documents, print_copy, meeting_facts, poll_history, locked_by_member_id, locked_at]
      properties:
        protocol_id: { type: string, format: uuid }
        number: { type: integer, format: int32 }
        meeting_date: { type: string, format: date }
        meeting: { $ref: "#/components/schemas/ProtocolMeeting" }
        agenda_items:
          description: Frozen text and slots with the document versions they were confirmed against.
          type: array
          items: { $ref: "#/components/schemas/AgendaItem" }
        documents:
          description: Cited case document versions.
          type: array
          items: { $ref: "#/components/schemas/CaseDocument" }
        print_copy: { $ref: "#/components/schemas/PrintCopy" }
        meeting_facts: { $ref: "#/components/schemas/MeetingFacts" }
        poll_history:
          description: The drafts' poll rounds as history, each labelled informal (AC-41).
          type: array
          items: { $ref: "#/components/schemas/PollRound" }
        locked_by_member_id: { type: string, format: uuid }
        locked_at: { type: string, format: date-time }
    RegistryDecision:
      description: registry_entries row — one decision (agenda item) of a signed protocol.
      type: object
      additionalProperties: false
      required: [protocol_id, agenda_item_id, number, meeting_date, subject, counterparty, amount_kopiyky, currency]
      properties:
        protocol_id: { type: string, format: uuid }
        agenda_item_id: { type: string, format: uuid }
        number: { type: integer, format: int32 }
        meeting_date: { type: string, format: date }
        subject: { type: string, maxLength: 500 }
        counterparty: { type: [string, "null"], maxLength: 500 }
        amount_kopiyky: { type: [integer, "null"], format: int64 }
        currency:
          oneOf:
            - $ref: "#/components/schemas/Currency"
            - type: "null"
    RegistryDecisionPage:
      type: object
      required: [items, withdrawn_numbers, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RegistryDecision" }
        withdrawn_numbers:
          description: Numbers of знятий з розгляду protocols inside this page's number range — gaps marked «знято з розгляду».
          type: array
          items: { type: integer, format: int32 }
        next_cursor: { type: [string, "null"] }
    MeetingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Meeting" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          $ref: "#/components/schemas/DependencyHealth"
    DependencyHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        version:
          type: string
          description: Server version reported by the dependency, when it is up.
    NewContract:
      type: object
      additionalProperties: false
      required: [counterparty, amount_cents, currency, signed_at]
      properties:
        counterparty: { type: string, minLength: 1, maxLength: 200 }
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          description: Contract value in minor units of currency.
        currency: { $ref: "#/components/schemas/Currency" }
        signed_at: { type: string, format: date }
        ends_at:
          type: [string, "null"]
          format: date
          description: Last day of the contract; on or after signed_at. Null for open-ended.
    Contract:
      type: object
      required: [id, counterparty, amount_cents, currency, signed_at, ends_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        counterparty: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        signed_at: { type: string, format: date }
        ends_at: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContractPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Contract" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.

    # enums (closed sets of data-model.md; Go constants, no CHECK)
    ApplicationKind:
      description: applications.kind — заявка на підключення / запит на передачу.
      type: string
      enum: [connection, transfer]
    ApplicationState:
      description: applications.state (PRD §10) — очікує · схвалена · відхилена.
      type: string
      enum: [pending, approved, rejected]
    DecisionOutcome:
      type: string
      enum: [approved, rejected]
    BoardPosition:
      description: application_filings.position and board_member_revisions.position — голова правління / член правління.
      type: string
      enum: [head, member]
    AssociationState:
      description: associations.state — підключене ОСББ / вимкнене ОСББ.
      type: string
      enum: [connected, disabled]
    ReviewWarningKind:
      description: розбіжність імен — the applicant's typed full name, the signer and the керівник differ after ignoring letter case, extra spaces, the form of the apostrophe and the order of the words (AC-11) — or an extract older than 30 days (AC-11b); advisory only.
      type: string
      enum: [name_mismatch, extract_age]
    AssociationEventKind:
      type: string
      enum: [connected, transfer_approved, disabled, enabled]

    # memberships
    Membership:
      type: object
      additionalProperties: false
      required: [association_id, association_name, association_state, board_member_id, position]
      properties:
        association_id: { type: string, format: uuid }
        association_name: { type: string, maxLength: 200 }
        association_state: { $ref: "#/components/schemas/AssociationState" }
        board_member_id: { type: string, format: uuid }
        position: { $ref: "#/components/schemas/BoardPosition" }
    MembershipPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
        next_cursor: { type: [string, "null"] }

    # applications
    NewApplication:
      description: |
        multipart body of fileApplication; application + its first filing + the extract. `position` is always
        `head`: the applicant does not choose it, and `member` is named in `identity.application_invalid` (AC-02).
      type: object
      required: [kind, edrpou, association_name, association_address, applicant_full_name, position, term_start, extract]
      properties:
        kind: { $ref: "#/components/schemas/ApplicationKind" }
        edrpou: { type: string, pattern: "^[0-9]{8}$", minLength: 8, maxLength: 8 }
        association_id:
          description: Only for a запит filed from the card of the association set up by hand (AC-19c).
          type: string
          format: uuid
        association_name: { type: string, minLength: 1, maxLength: 200 }
        association_address: { type: string, minLength: 1, maxLength: 500 }
        applicant_full_name:
          description: The applicant's own ПІБ; compared with the signer and the керівник the оператор records (AC-11).
          type: string
          minLength: 1
          maxLength: 200
        position: { $ref: "#/components/schemas/BoardPosition" }
        term_start:
          description: Not later than the filing date (Europe/Kyiv); a later date is named in identity.application_invalid (AC-02).
          type: string
          format: date
        term_end:
          description: Optional. A date earlier than the filing date answers identity.term_ended; the filing date itself is still in force (AC-30).
          type: string
          format: date
        extract:
          description: |
            The КЕП-signed витяг з ЄДР as one file ≤ 5 MB: a PDF with the signature inside it, or a signed container
            that holds the PDF (`.p7s`, ASiC-E); a signature sent as a second, separate file is not accepted
            (PRD §6). Kept unchanged, never parsed (ADR-0005).
          type: string
          contentMediaType: application/octet-stream
    ApplicationRefiling:
      description: |
        multipart body of refileApplication; a new filing of the same application (AC-06), under the same field
        rules as NewApplication (AC-02, AC-30).
      type: object
      required: [association_name, association_address, applicant_full_name, position, term_start, extract]
      properties:
        association_name: { type: string, minLength: 1, maxLength: 200 }
        association_address: { type: string, minLength: 1, maxLength: 500 }
        applicant_full_name:
          description: The applicant's own ПІБ; compared with the signer and the керівник the оператор records (AC-11).
          type: string
          minLength: 1
          maxLength: 200
        position: { $ref: "#/components/schemas/BoardPosition" }
        term_start:
          description: Not later than the filing date (Europe/Kyiv); a later date is named in identity.application_invalid (AC-02).
          type: string
          format: date
        term_end:
          description: Optional. A date earlier than the filing date answers identity.term_ended; the filing date itself is still in force (AC-30).
          type: string
          format: date
        extract:
          description: The new КЕП-signed витяг з ЄДР, one file ≤ 5 MB, in the same forms as in NewApplication.
          type: string
          contentMediaType: application/octet-stream
    Application:
      description: applications row + its latest filing's name and date + the latest rejection reason.
      type: object
      additionalProperties: false
      required: [id, kind, edrpou, association_id, association_name, state, filed_at, rejection_reason, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ApplicationKind" }
        edrpou: { type: string, maxLength: 8 }
        association_id: { type: [string, "null"], format: uuid }
        association_name: { type: string, maxLength: 200 }
        state: { $ref: "#/components/schemas/ApplicationState" }
        filed_at:
          description: created_at of the latest filing (AC-05 «очікує розгляду з …»).
          type: string
          format: date-time
        rejection_reason: { type: [string, "null"], maxLength: 1000 }
        created_at: { type: string, format: date-time }
    ApplicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        next_cursor: { type: [string, "null"] }
    ExtractRef:
      description: application_extracts metadata; the content is served only by the download operations.
      type: object
      additionalProperties: false
      required: [id, original_name, media_type, size_bytes, sha256]
      properties:
        id: { type: string, format: uuid }
        original_name: { type: string, maxLength: 255 }
        media_type: { type: string, maxLength: 100 }
        size_bytes: { type: integer, format: int64, maximum: 5242880 }
        sha256:
          description: Hex of the 32-byte SHA-256 of the stored content.
          type: string
          pattern: "^[0-9a-f]{64}$"
    ApplicationFiling:
      type: object
      additionalProperties: false
      required: [id, association_name, association_address, applicant_full_name, position, term_start, term_end, extract, created_at]
      properties:
        id: { type: string, format: uuid }
        association_name: { type: string, maxLength: 200 }
        association_address: { type: string, maxLength: 500 }
        applicant_full_name: { type: string, maxLength: 200 }
        position: { $ref: "#/components/schemas/BoardPosition" }
        term_start: { type: string, format: date }
        term_end: { type: [string, "null"], format: date }
        extract: { $ref: "#/components/schemas/ExtractRef" }
        created_at: { type: string, format: date-time }
    ApplicationDecision:
      type: object
      additionalProperties: false
      required: [id, filing_id, outcome, reason, relied_on_document, association_id, decided_at]
      properties:
        id: { type: string, format: uuid }
        filing_id: { type: string, format: uuid }
        outcome: { $ref: "#/components/schemas/DecisionOutcome" }
        reason: { type: [string, "null"], maxLength: 1000 }
        relied_on_document: { type: [string, "null"], maxLength: 500 }
        association_id: { type: [string, "null"], format: uuid }
        decided_at: { type: string, format: date-time }
    ApplicationDetail:
      description: The applicant's view; filings and decisions newest first.
      type: object
      additionalProperties: false
      required: [application, filings, decisions]
      properties:
        application: { $ref: "#/components/schemas/Application" }
        filings:
          type: array
          items: { $ref: "#/components/schemas/ApplicationFiling" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/ApplicationDecision" }
    NewExtractCheck:
      type: object
      additionalProperties: false
      required: [filing_id, signature_valid, signer_full_name, signed_on, head_full_name, extract_edrpou, extract_dated_on]
      properties:
        filing_id: { type: string, format: uuid }
        signature_valid: { type: boolean }
        signer_full_name: { type: string, minLength: 1, maxLength: 200 }
        signed_on: { type: string, format: date }
        head_full_name: { type: string, minLength: 1, maxLength: 200 }
        extract_edrpou: { type: string, pattern: "^[0-9]{8}$", minLength: 8, maxLength: 8 }
        extract_dated_on: { type: string, format: date }
    ExtractCheck:
      type: object
      additionalProperties: false
      required: [id, filing_id, signature_valid, signer_full_name, signed_on, head_full_name, extract_edrpou, extract_dated_on, checked_at]
      properties:
        id: { type: string, format: uuid }
        filing_id: { type: string, format: uuid }
        signature_valid: { type: boolean }
        signer_full_name: { type: string, maxLength: 200 }
        signed_on: { type: string, format: date }
        head_full_name: { type: string, maxLength: 200 }
        extract_edrpou: { type: string, maxLength: 8 }
        extract_dated_on: { type: string, format: date }
        checked_at: { type: string, format: date-time }
    ReviewWarning:
      type: object
      additionalProperties: false
      required: [kind, detail]
      properties:
        kind: { $ref: "#/components/schemas/ReviewWarningKind" }
        detail:
          description: Which values differ, or the extract's date (AC-11, AC-11b).
          type: string
          maxLength: 500
    ApplicationReview:
      description: The оператор's view (AC-10). Values entered by the applicant and recorded by the оператор are told apart by where they sit (filings vs checks).
      type: object
      additionalProperties: false
      required: [application, applicant_email, filings, checks, decisions, warnings, competing_application_ids, storage_account_email]
      properties:
        application: { $ref: "#/components/schemas/Application" }
        applicant_email: { type: string, format: email, maxLength: 320 }
        filings:
          type: array
          items: { $ref: "#/components/schemas/ApplicationFiling" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ExtractCheck" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/ApplicationDecision" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ReviewWarning" }
        competing_application_ids:
          description: Other pending applications for the same ЄДРПОУ (AC-04c, AC-19b).
          type: array
          items: { type: string, format: uuid }
        storage_account_email:
          description: For a запит на передачу — the account that holds the association's files (AC-28b); null otherwise.
          type: [string, "null"]
          format: email
          maxLength: 320
    ApproveApplicationRequest:
      type: object
      additionalProperties: false
      required: [filing_id]
      properties:
        filing_id:
          description: The filing shown to the оператор; a newer filing answers identity.application_not_pending.
          type: string
          format: uuid
        relied_on_document:
          description: Required when розбіжність імен is open (AC-12) — a typed reference to the document, no file is uploaded.
          type: string
          minLength: 1
          maxLength: 500
    RejectApplicationRequest:
      type: object
      additionalProperties: false
      required: [filing_id, reason]
      properties:
        filing_id: { type: string, format: uuid }
        reason:
          description: Shown to the applicant; empty → identity.reason_required (AC-13).
          type: string
          maxLength: 1000

    # associations
    OperatorAssociation:
      type: object
      additionalProperties: false
      required: [id, name, edrpou, state, connected_by_hand, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        edrpou: { type: [string, "null"], maxLength: 8 }
        state: { $ref: "#/components/schemas/AssociationState" }
        connected_by_hand:
          description: confirmed_by_decision_id is null — «підключено вручну, без витягу».
          type: boolean
        created_at: { type: string, format: date-time }
    OperatorAssociationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OperatorAssociation" }
        next_cursor: { type: [string, "null"] }
    DisableAssociationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          description: Shown to the members; empty → identity.reason_required (AC-22).
          type: string
          maxLength: 1000
    AssociationStateChange:
      description: association_state_changes row.
      type: object
      additionalProperties: false
      required: [association_id, state, reason, changed_at]
      properties:
        association_id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/AssociationState" }
        reason: { type: [string, "null"], maxLength: 1000 }
        changed_at: { type: string, format: date-time }
    AssociationEvent:
      description: |
        One step of the chain on the card — an approval (with the extract it relied on) or a state change.
        A roster entry's `decision_id` (`BoardMember`, governance) matches `decision_id` here, which gives the
        «за запитом на передачу від <filed_at>, схвалено оператором <occurred_at>» mark and the extract of AC-20.
      type: object
      additionalProperties: false
      required: [kind, occurred_at, decision_id, filed_at, reason, head_full_name, signer_full_name, extract_id, extract_dated_on]
      properties:
        kind: { $ref: "#/components/schemas/AssociationEventKind" }
        occurred_at: { type: string, format: date-time }
        decision_id:
          description: application_decisions.id of an approval; null for a state change.
          type: [string, "null"]
          format: uuid
        filed_at:
          description: created_at of the filing the approval decided; null for a state change.
          type: [string, "null"]
          format: date-time
        reason: { type: [string, "null"], maxLength: 1000 }
        head_full_name: { type: [string, "null"], maxLength: 200 }
        signer_full_name: { type: [string, "null"], maxLength: 200 }
        extract_id: { type: [string, "null"], format: uuid }
        extract_dated_on: { type: [string, "null"], format: date }
    AssociationCard:
      type: object
      additionalProperties: false
      required: [id, name, edrpou, address, state, head_full_name, connected_by_hand, history]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        edrpou: { type: [string, "null"], maxLength: 8 }
        address: { type: [string, "null"], maxLength: 500 }
        state: { $ref: "#/components/schemas/AssociationState" }
        head_full_name:
          description: The roster entry with position head, if any (null for the association set up by hand until AC-19c).
          type: [string, "null"]
          maxLength: 200
        connected_by_hand: { type: boolean }
        history:
          description: Newest first (AC-29).
          type: array
          items: { $ref: "#/components/schemas/AssociationEvent" }

    # storage connection
    StorageConnection:
      type: object
      additionalProperties: false
      required: [connected, google_account_email, connected_by_member_id, connected_at]
      properties:
        connected: { type: boolean }
        google_account_email: { type: [string, "null"], format: email, maxLength: 320 }
        connected_by_member_id: { type: [string, "null"], format: uuid }
        connected_at: { type: [string, "null"], format: date-time }
    CompleteStorageConnectionRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
