              protocol_revision: 7
              subject: Про затвердження договору на гідроізоляцію покрівлі
              fragments:
                - { text: "Затвердити договір з " }
                - { slot: 0192f6a0-0000-7000-8000-000000001101 }
                - { text: " на суму " }
                - { slot: 0192f6a0-0000-7000-8000-000000001102 }
